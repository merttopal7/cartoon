      - { who: "toprak", at: 118.44, do: "talk", duration: 6.61, text: "Şimdi benim sıram. Kökü var ama ağaç değil. Taşları tutar, yağmuru içer. Nedir?", audio: "audio/bolum-1-ormanin-bekcileri/toprak_2e8b1d8b7d.mp3" }

      - { who: "toprak", at: 511.7, do: "talk", duration: 1.65, text: "Ağaçlar mutlu olur mu?", audio: "audio/bolum-1-ormanin-bekcileri/toprak_37030ea21f.mp3" }
      - { who: "mese", at: 513.87, do: "look_at", target: "camera", duration: 3.95 }

      - { who: "defne", at: 93.58, do: "talk", duration: 2.35, text: "Ama ben acele ederim. Kim önce kıvrıma varır?", audio: "audio/bolum-1-ormanin-bekcileri/defne_ab19041a96.mp3" }
      - { who: "defne", at: 96.5, do: "look_at", target: "toprak", duration: 3.49 }

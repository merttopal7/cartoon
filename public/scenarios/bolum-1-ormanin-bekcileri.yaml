      - { who: "mese", at: 121.42, do: "talk", duration: 1.12, text: "Ne buldun?", audio: "audio/bolum-1-ormanin-bekcileri/mese_c92e5f2317.mp3" }
      - { who: "defne", at: 122.63, do: "look_at", target: "toprak", duration: 6.91 }
      - { who: "toprak", at: 122.78, do: "talk", duration: 3.37, text: "Ayak izleri. Bunlar geyik izi... hem de bir sürü.", audio: "audio/bolum-1-ormanin-bekcileri/toprak_d61e8a815d.mp3" }
      - { who: "mese", at: 126.24, do: "look_at", target: "defne", duration: 2.86 }

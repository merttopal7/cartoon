      - { who: "mese", at: 221.26, do: "walk_to", to: [48.76, 41.85], speed: 1.42, road: true, lane: -1.3 }
      - { who: "toprak", at: 221.41, do: "look_at", target: "defne", duration: 2.42 }
      - { who: "defne", at: 221.56, do: "talk", duration: 2.12, text: "Meşe, senin en sevdiğin ağaç hangisi?", audio: "audio/bolum-1-ormanin-bekcileri/defne_01199fa557.mp3" }
      - { who: "mese", at: 223.72, do: "look_at", target: "camera", duration: 4.87 }
      - { who: "defne", at: 223.77, do: "look_at", target: "mese", duration: 4.77 }
      - { who: "toprak", at: 223.77, do: "look_at", target: "mese", duration: 7.88 }
      - { who: "mese", at: 223.92, do: "talk", duration: 4.47, text: "Adımı aldığım ağaç. Meşe. Yüz yıl yaşar, hep sabırlıdır.", audio: "audio/bolum-1-ormanin-bekcileri/mese_20c885e092.mp3" }
      - { who: "defne", at: 228.48, do: "look_at", target: "toprak", duration: 2.73 }
      - { who: "toprak", at: 228.63, do: "talk", duration: 2.43, text: "Benimki çam. Kışın bile yeşil kalıyor!", audio: "audio/bolum-1-ormanin-bekcileri/toprak_1f4ffc4c59.mp3" }
      - { who: "toprak", at: 231.15, do: "look_at", target: "defne", duration: 3.38 }
      - { who: "defne", at: 231.3, do: "talk", duration: 3.08, text: "Benimki en uzun olanı. Tepesinden bütün ormanı görürüm!", audio: "audio/bolum-1-ormanin-bekcileri/defne_a6f649c082.mp3" }
      - { who: "mese", at: 234.38, do: "look_at", target: "camera", duration: 1.92 }
      - { who: "defne", at: 234.43, do: "look_at", target: "mese", duration: 1.82 }
      - { who: "toprak", at: 234.43, do: "look_at", target: "mese", duration: 3.55 }
      - { who: "mese", at: 234.58, do: "talk", duration: 1.52, text: "Şşş. Durun bir saniye.", audio: "audio/bolum-1-ormanin-bekcileri/mese_20e068c0a4.mp3" }
      - { who: "defne", at: 236.1, do: "turn", to: "mese", duration: 0.5 }
      - { who: "mese", at: 236.1, do: "clip", name: "idle_2", duration: 4.5, loop: false, fade: 0.35 }

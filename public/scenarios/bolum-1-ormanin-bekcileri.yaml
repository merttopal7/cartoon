      - { who: "mese", at: 476.34, do: "talk", duration: 3.37, text: "Dikkatli ol Defne. Yavaşça, kökünün tam üstüne.", audio: "audio/bolum-1-ormanin-bekcileri/mese_4b87674750.mp3" }
      - { who: "defne", at: 480.01, do: "talk", duration: 1.31, text: "Rüzgâr, bana güç ver!", audio: "audio/bolum-1-ormanin-bekcileri/defne_fe5d847ba1.mp3" }

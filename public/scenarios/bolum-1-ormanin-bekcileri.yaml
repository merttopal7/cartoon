      - { who: "toprak", at: 540.87, do: "look_at", target: "mese", duration: 4.11 }
      - { who: "mese", at: 541.02, do: "talk", duration: 3.81, text: "Orman tek bir aile gibidir. Biri incinirse, hepsi hisseder.", audio: "audio/bolum-1-ormanin-bekcileri/mese_69cbc3285e.mp3" }
      - { who: "defne", at: 545.4, do: "look_at", target: "toprak", duration: 3.47 }
      - { who: "mese", at: 545.4, do: "look_at", target: "toprak", duration: 2.55 }
      - { who: "toprak", at: 545.55, do: "talk", duration: 2.25, text: "O zaman geyikler de geri gelir, değil mi?", audio: "audio/bolum-1-ormanin-bekcileri/toprak_0997d584f4.mp3" }
      - { who: "mese", at: 548.32, do: "look_at", target: "camera", duration: 2.41 }

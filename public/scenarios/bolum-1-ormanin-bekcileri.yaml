      - { who: "defne", at: 401.87, do: "talk", duration: 2.53, text: "Biliyordum... Seni denedim sadece.", audio: "audio/bolum-1-ormanin-bekcileri/defne_4014b664bb.mp3" }
      - { who: "mese", at: 404.7, do: "look_at", target: "camera", duration: 3.2 }

      - { who: "mese", at: 502.99, do: "talk", duration: 2.56, text: "Şimdi biraz su. Yarası kapansın.", audio: "audio/bolum-1-ormanin-bekcileri/mese_081219c2bc.mp3" }
      - { who: "mese", at: 502.99, do: "clip", name: "casting", duration: 1.4, loop: false, fade: 0.3 }

      - { who: "toprak", at: 453.44, do: "look_at", target: "mese", duration: 6.93 }
      - { who: "mese", at: 453.59, do: "talk", duration: 3.63, text: "Bu ağaç hâlâ yaşıyor. Reçinesi taze, kökleri nemli.", audio: "audio/bolum-1-ormanin-bekcileri/mese_abd3d53dbe.mp3" }
      - { who: "defne", at: 457.79, do: "look_at", target: "toprak", duration: 2.58 }

      - { who: "toprak", at: 96.65, do: "talk", duration: 3.19, text: "Yarış yok! Devriyedeyiz, unuttun mu?", audio: "audio/bolum-1-ormanin-bekcileri/toprak_30110b1784.mp3" }
      - { who: "mese", at: 100.41, do: "look_at", target: "defne", duration: 3.41 }

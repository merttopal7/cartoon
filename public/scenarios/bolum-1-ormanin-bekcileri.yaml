      - { who: "toprak", at: 506.27, do: "talk", duration: 2.06, text: "Ben de kökünü toprakla sarayım.", audio: "audio/bolum-1-ormanin-bekcileri/toprak_0f57f73ca2.mp3" }
      - { who: "toprak", at: 506.27, do: "clip", name: "point", duration: 3.0, loop: false, fade: 0.3 }

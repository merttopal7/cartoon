      - { who: "toprak", at: 193.74, do: "talk", duration: 1.28, text: "Yakaladım!", audio: "audio/bolum-1-ormanin-bekcileri/toprak_9804bb201d.mp3" }
      - { who: "toprak", at: 193.74, do: "emote", expression: "happy", duration: 1.88 }
      - { who: "toprak", at: 195.11, do: "look_at", target: "defne", duration: 1.84 }
      - { who: "defne", at: 195.26, do: "talk", duration: 1.54, text: "Bu sefer şanslıydın!", audio: "audio/bolum-1-ormanin-bekcileri/defne_ef15c4682b.mp3" }
      - { who: "defne", at: 195.26, do: "emote", expression: "angry", duration: 2.14 }
      - { who: "mese", at: 196.84, do: "look_at", target: "camera", duration: 3.8 }
      - { who: "defne", at: 196.89, do: "look_at", target: "mese", duration: 5.69 }
      - { who: "toprak", at: 196.89, do: "look_at", target: "mese", duration: 3.7 }
      - { who: "mese", at: 197.04, do: "talk", duration: 3.4, text: "İkiniz de iyiydiniz. Hızlı da olmalı, dikkatli de.", audio: "audio/bolum-1-ormanin-bekcileri/mese_659e4d63dd.mp3" }
      - { who: "mese", at: 197.04, do: "emote", expression: "happy", duration: 3.5 }
      - { who: "toprak", at: 200.53, do: "look_at", target: "defne", duration: 1.61 }
      - { who: "defne", at: 200.68, do: "talk", duration: 1.31, text: "Duydun mu? Hızlı!", audio: "audio/bolum-1-ormanin-bekcileri/defne_ed061f1fa2.mp3" }
      - { who: "defne", at: 202.08, do: "look_at", target: "toprak", duration: 2.45 }
      - { who: "mese", at: 202.08, do: "look_at", target: "toprak", duration: 2.45 }
      - { who: "toprak", at: 202.23, do: "talk", duration: 1.65, text: "Duydum. Dikkatli!", audio: "audio/bolum-1-ormanin-bekcileri/toprak_e7aee028c9.mp3" }
      - { who: "defne", at: 204.03, do: "look_at", target: "toprak", duration: 3.83 }
      - { who: "mese", at: 204.03, do: "look_at", target: "toprak", duration: 2.78 }
      - { who: "toprak", at: 204.18, do: "talk", duration: 2.48, text: "Meşe, sen ormanı nasıl dinliyorsun?", audio: "audio/bolum-1-ormanin-bekcileri/toprak_4cb9d02549.mp3" }
      - { who: "mese", at: 206.66, do: "ability", name: "dalga_gosterisi" }
      - { who: "mese", at: 207.31, do: "look_at", target: "camera", duration: 3.59 }
      - { who: "defne", at: 207.36, do: "look_at", target: "mese", duration: 6.94 }
      - { who: "toprak", at: 207.36, do: "look_at", target: "mese", duration: 4.04 }
      - { who: "mese", at: 207.51, do: "talk", duration: 3.19, text: "Su gibi. Sessizce akarsın, her sesi duyarsın.", audio: "audio/bolum-1-ormanin-bekcileri/mese_940650e941.mp3" }
      - { who: "mese", at: 210.9, do: "look_at", target: "defne", duration: 2.96 }
      - { who: "toprak", at: 210.9, do: "look_at", target: "defne", duration: 2.96 }
      - { who: "defne", at: 211.05, do: "talk", duration: 2.66, text: "Ben de rüzgâr gibi dinlerim. Her yere bir anda!", audio: "audio/bolum-1-ormanin-bekcileri/defne_033d7211f9.mp3" }
      - { who: "defne", at: 211.05, do: "clip", name: "northern_soul_spin", duration: 2.0, loop: false, fade: 0.3 }
      - { who: "defne", at: 213.8, do: "look_at", target: "toprak", duration: 4.82 }
      - { who: "toprak", at: 213.95, do: "talk", duration: 4.52, text: "Ben de toprak gibi. Ayağımın altında her adımı hissederim.", audio: "audio/bolum-1-ormanin-bekcileri/toprak_8957165c8a.mp3" }
      - { who: "mese", at: 218.51, do: "look_at", target: "camera", duration: 2.75 }
      - { who: "defne", at: 218.56, do: "look_at", target: "mese", duration: 5.71 }
      - { who: "toprak", at: 218.56, do: "look_at", target: "mese", duration: 3.35 }
      - { who: "mese", at: 218.71, do: "talk", duration: 2.35, text: "İşte bu yüzden birlikte güçlüyüz.", audio: "audio/bolum-1-ormanin-bekcileri/mese_12d12b9afe.mp3" }
      - { who: "defne", at: 221.06, do: "walk_to", to: [49.56, 40.55], speed: 1.42, road: true, lane: 0.0 }

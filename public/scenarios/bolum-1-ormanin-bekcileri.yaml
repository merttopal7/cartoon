      - { who: "toprak", at: 69.35, do: "talk", duration: 2.01, text: "Hey! Ben de büyüyorum ama!", audio: "audio/bolum-1-ormanin-bekcileri/toprak_4cf3e012ba.mp3" }
      - { who: "toprak", at: 69.35, do: "emote", expression: "happy", duration: 2.61 }

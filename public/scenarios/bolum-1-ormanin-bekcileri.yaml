      - { who: "defne", at: 153.49, do: "talk", duration: 2.56, text: "Geyikler sabah yürüyüşüne çıkmış, ne var bunda?", audio: "audio/bolum-1-ormanin-bekcileri/defne_a663031acb.mp3" }

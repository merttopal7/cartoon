      - { who: "defne", at: 75.74, do: "talk", duration: 2.35, text: "Ama ben acele ederim. Kim önce kıvrıma varır?", audio: "audio/bolum-1-ormanin-bekcileri/defne_ab19041a96.mp3" }
      - { who: "defne", at: 78.18, do: "look_at", target: "toprak", duration: 6.36 }

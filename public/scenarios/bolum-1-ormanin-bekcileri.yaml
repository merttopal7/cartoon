      - { who: "mese", at: 109.03, do: "talk", duration: 2.19, text: "Bence gayet adil bir bilmeceydi.", audio: "audio/bolum-1-ormanin-bekcileri/mese_49ebd3163b.mp3" }
      - { who: "mese", at: 109.03, do: "emote", expression: "happy", duration: 2.79 }

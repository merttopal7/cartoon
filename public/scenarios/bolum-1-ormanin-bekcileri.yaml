      - { who: "toprak", at: 459.87, do: "look_at", target: "mese", duration: 3.25 }
      - { who: "mese", at: 460.02, do: "talk", duration: 2.95, text: "Hemen kökünün üstüne dikilirse, iyileşebilir.", audio: "audio/bolum-1-ormanin-bekcileri/mese_af29e08c49.mp3" }
      - { who: "defne", at: 463.54, do: "look_at", target: "toprak", duration: 3.49 }
      - { who: "mese", at: 463.54, do: "look_at", target: "toprak", duration: 4.41 }
      - { who: "toprak", at: 463.69, do: "talk", duration: 3.19, text: "Ama bu ağaç çok ağır! Üçümüz bile kaldıramayız.", audio: "audio/bolum-1-ormanin-bekcileri/toprak_c7d1d0b8b2.mp3" }
      - { who: "mese", at: 467.45, do: "look_at", target: "defne", duration: 3.75 }
      - { who: "toprak", at: 467.45, do: "look_at", target: "defne", duration: 2.83 }
      - { who: "defne", at: 467.6, do: "talk", duration: 2.53, text: "Siz kaldıramazsınız. Ama rüzgâr kaldırır!", audio: "audio/bolum-1-ormanin-bekcileri/defne_de6ba07189.mp3" }
      - { who: "defne", at: 467.6, do: "emote", expression: "happy", duration: 3.13 }
      - { who: "defne", at: 470.7, do: "look_at", target: "toprak", duration: 2.42 }
      - { who: "mese", at: 470.7, do: "look_at", target: "toprak", duration: 3.34 }
      - { who: "toprak", at: 470.85, do: "talk", duration: 2.12, text: "Ciddi misin? Bu koca çamı mı?", audio: "audio/bolum-1-ormanin-bekcileri/toprak_19c38c4705.mp3" }
      - { who: "toprak", at: 473.54, do: "look_at", target: "defne", duration: 3.15 }
      - { who: "defne", at: 473.69, do: "talk", duration: 2.35, text: "Hiç bu kadar ciddi olmamıştım. Geri çekilin!", audio: "audio/bolum-1-ormanin-bekcileri/defne_f98e433856.mp3" }
      - { who: "toprak", at: 476.04, do: "walk_to", to: [33.4, 37.0], speed: 1.3 }

      - { who: "toprak", at: 416.67, do: "clip", name: "point", duration: 6.0, loop: false, fade: 0.35 }
      - { who: "toprak", at: 417.07, do: "talk", duration: 5.41, text: "Hayır. Bunlar ayakkabı izi. Hem de çok büyük... Bir yetişkininki gibi.", audio: "audio/bolum-1-ormanin-bekcileri/toprak_64b210e5e9.mp3" }
      - { who: "mese", at: 423.0, do: "look_at", target: "camera", duration: 3.3 }
      - { who: "mese", at: 423.2, do: "talk", duration: 2.9, text: "Ve ağır basmış. Toprak iyice çökmüş.", audio: "audio/bolum-1-ormanin-bekcileri/mese_f9da61097c.mp3" }
      - { who: "mese", at: 426.67, do: "look_at", target: "defne", duration: 3.23 }
      - { who: "toprak", at: 426.67, do: "look_at", target: "defne", duration: 2.31 }
      - { who: "defne", at: 426.82, do: "talk", duration: 2.01, text: "Ormanda bizden başka kim dolaşır ki?", audio: "audio/bolum-1-ormanin-bekcileri/defne_d46d734758.mp3" }
      - { who: "defne", at: 429.4, do: "look_at", target: "toprak", duration: 6.93 }
      - { who: "mese", at: 429.4, do: "look_at", target: "toprak", duration: 4.62 }
      - { who: "toprak", at: 429.55, do: "talk", duration: 3.4, text: "İzler çalılığa doğru gidiyor... Sonra kayboluyor.", audio: "audio/bolum-1-ormanin-bekcileri/toprak_95ec6c58a3.mp3" }
      - { who: "mese", at: 433.52, do: "look_at", target: "defne", duration: 1.89 }
      - { who: "toprak", at: 433.52, do: "look_at", target: "defne", duration: 2.81 }
      - { who: "defne", at: 433.67, do: "talk", duration: 1.59, text: "Takip edelim! Hemen yakalarız!", audio: "audio/bolum-1-ormanin-bekcileri/defne_93780697c5.mp3" }
      - { who: "defne", at: 433.67, do: "emote", expression: "happy", duration: 2.19 }
      - { who: "mese", at: 435.78, do: "look_at", target: "camera", duration: 4.55 }
      - { who: "defne", at: 435.83, do: "look_at", target: "mese", duration: 5.37 }
      - { who: "toprak", at: 435.83, do: "look_at", target: "mese", duration: 4.45 }
      - { who: "mese", at: 435.98, do: "talk", duration: 4.15, text: "Hayır. Önce ağaç. O beklerse kurur, izler ise kaçmaz.", audio: "audio/bolum-1-ormanin-bekcileri/mese_4ed63259a8.mp3" }
      - { who: "defne", at: 440.7, do: "look_at", target: "toprak", duration: 3.28 }
      - { who: "mese", at: 440.7, do: "look_at", target: "toprak", duration: 4.2 }
      - { who: "toprak", at: 440.85, do: "talk", duration: 2.98, text: "Meşe haklı. Önce ağacı kurtaralım.", audio: "audio/bolum-1-ormanin-bekcileri/toprak_de59ae0349.mp3" }
      - { who: "mese", at: 444.4, do: "look_at", target: "defne", duration: 3.15 }
      - { who: "toprak", at: 444.4, do: "look_at", target: "defne", duration: 3.15 }
      - { who: "defne", at: 444.55, do: "talk", duration: 2.85, text: "Peki... Ama sonra o izlerin peşine düşüyoruz!", audio: "audio/bolum-1-ormanin-bekcileri/defne_315ecb7bef.mp3" }
      - { who: "toprak", at: 447.4, do: "walk_to", to: [31.0, 36.6], speed: 1.1 }

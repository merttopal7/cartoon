      - { who: "defne", at: 411.52, do: "talk", duration: 1.28, text: "Geyik izi mi yine?", audio: "audio/bolum-1-ormanin-bekcileri/defne_168212c160.mp3" }
      - { who: "defne", at: 416.67, do: "look_at", target: [33.0, 17.2, 33.6], duration: 5.0 }

      - { who: "toprak", at: 104.84, do: "talk", duration: 1.52, text: "Toprak! Benim adım!", audio: "audio/bolum-1-ormanin-bekcileri/toprak_9f355f5b53.mp3" }
      - { who: "toprak", at: 106.45, do: "look_at", target: "defne", duration: 2.49 }
      - { who: "defne", at: 106.6, do: "talk", duration: 2.19, text: "Bu haksızlık! Kendi adını sordun!", audio: "audio/bolum-1-ormanin-bekcileri/defne_b1742b3420.mp3" }

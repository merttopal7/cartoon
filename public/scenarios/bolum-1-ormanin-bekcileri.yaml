      - { who: "mese", at: 60.45, do: "talk", duration: 2.56, text: "Toprak, geçen hafta diktiğin fidanlar nasıl?", audio: "audio/bolum-1-ormanin-bekcileri/mese_4878ae699f.mp3" }
      - { who: "defne", at: 63.1, do: "look_at", target: "toprak", duration: 2.91 }
      - { who: "toprak", at: 63.25, do: "talk", duration: 2.61, text: "Büyüyorlar! Biri neredeyse dizime geldi.", audio: "audio/bolum-1-ormanin-bekcileri/toprak_a01fd6b6af.mp3" }
      - { who: "toprak", at: 63.25, do: "emote", expression: "happy", duration: 3.21 }

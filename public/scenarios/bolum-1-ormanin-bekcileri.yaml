      - { who: "toprak", at: 65.95, do: "look_at", target: "defne", duration: 2.6 }
      - { who: "defne", at: 66.1, do: "talk", duration: 2.3, text: "Dizine mi? O zaman yakında benden uzun olur!", audio: "audio/bolum-1-ormanin-bekcileri/defne_4211934ab7.mp3" }

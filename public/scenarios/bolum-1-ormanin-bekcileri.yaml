      - { who: "mese", at: 94.79, do: "talk", duration: 1.36, text: "Bildin Toprak.", audio: "audio/bolum-1-ormanin-bekcileri/mese_50c8dc8847.mp3" }
      - { who: "defne", at: 96.24, do: "look_at", target: "toprak", duration: 8.95 }
      - { who: "toprak", at: 96.39, do: "talk", duration: 6.61, text: "Şimdi benim sıram. Kökü var ama ağaç değil. Taşları tutar, yağmuru içer. Nedir?", audio: "audio/bolum-1-ormanin-bekcileri/toprak_2e8b1d8b7d.mp3" }

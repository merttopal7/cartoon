      - { who: "defne", at: 495.21, do: "talk", duration: 1.88, text: "Söylemiştim! Rüzgâr benim kanadım!", audio: "audio/bolum-1-ormanin-bekcileri/defne_1d96b60ef8.mp3" }
      - { who: "defne", at: 495.21, do: "emote", expression: "happy", duration: 2.48 }

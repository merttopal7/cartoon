      - { who: "defne", at: 57.82, do: "talk", duration: 1.28, text: "Çünkü ben her gün uçarım!", audio: "audio/bolum-1-ormanin-bekcileri/defne_5ab9ee848a.mp3" }
      - { who: "defne", at: 57.82, do: "emote", expression: "happy", duration: 1.88 }

      - { who: "defne", at: 117.09, do: "talk", duration: 2.38, text: "Rüzgâr diyecektin ama... Olsun, kabul!", audio: "audio/bolum-1-ormanin-bekcileri/defne_87dc4c42a6.mp3" }

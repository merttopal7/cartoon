      - { who: "mese", at: 161.88, do: "talk", duration: 2.72, text: "Çamur hâlâ ıslak. Bu izler bu sabah olmuş.", audio: "audio/bolum-1-ormanin-bekcileri/mese_246d69b5f8.mp3" }

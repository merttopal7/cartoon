      - { who: "toprak", at: 42.93, do: "talk", duration: 3.19, text: "Bu sabah toprak çok yumuşak. Gece çiğ düşmüş.", audio: "audio/bolum-1-ormanin-bekcileri/toprak_deae1535d7.mp3" }
      - { who: "mese", at: 46.16, do: "look_at", target: "camera", duration: 4.55 }

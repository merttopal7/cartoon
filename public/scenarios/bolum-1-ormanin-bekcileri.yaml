      - { who: "toprak", at: 236.34, do: "talk", duration: 0.89, text: "Ne oldu?", audio: "audio/bolum-1-ormanin-bekcileri/toprak_4685980a06.mp3" }
      - { who: "mese", at: 237.43, do: "look_at", target: "camera", duration: 2.83 }
      - { who: "defne", at: 237.48, do: "look_at", target: "mese", duration: 2.73 }
      - { who: "toprak", at: 237.48, do: "look_at", target: "mese", duration: 5.37 }
      - { who: "mese", at: 237.63, do: "talk", duration: 2.43, text: "Dinleyin. Kuşlar... Hiç ses yok.", audio: "audio/bolum-1-ormanin-bekcileri/mese_11bf96b446.mp3" }
      - { who: "mese", at: 242.35, do: "look_at", target: "defne", duration: 2.65 }
      - { who: "toprak", at: 242.35, do: "look_at", target: "defne", duration: 2.65 }
      - { who: "defne", at: 242.5, do: "talk", duration: 2.35, text: "Gerçekten. Bu saatte burası cıvıl cıvıl olur.", audio: "audio/bolum-1-ormanin-bekcileri/defne_33b47847d1.mp3" }
      - { who: "defne", at: 244.94, do: "look_at", target: "toprak", duration: 7.31 }
      - { who: "mese", at: 244.94, do: "look_at", target: "toprak", duration: 4.51 }
      - { who: "toprak", at: 245.09, do: "talk", duration: 4.21, text: "Önce geyikler, şimdi de kuşlar... Burada bir tuhaflık var.", audio: "audio/bolum-1-ormanin-bekcileri/toprak_faa7a8b9fa.mp3" }
      - { who: "toprak", at: 249.39, do: "look_at", target: "defne", duration: 2.42 }
      - { who: "defne", at: 249.54, do: "talk", duration: 2.12, text: "Ben önden bakayım! Rüzgârdan hızlıyım!", audio: "audio/bolum-1-ormanin-bekcileri/defne_82e483647c.mp3" }
      - { who: "defne", at: 249.54, do: "emote", expression: "happy", duration: 2.72 }
      - { who: "mese", at: 251.7, do: "look_at", target: "camera", duration: 2.52 }
      - { who: "defne", at: 251.75, do: "look_at", target: "mese", duration: 2.42 }
      - { who: "toprak", at: 251.75, do: "look_at", target: "mese", duration: 2.42 }
      - { who: "mese", at: 251.9, do: "talk", duration: 2.12, text: "Defne, bekle! Uzaklaşma!", audio: "audio/bolum-1-ormanin-bekcileri/mese_563d5f1d56.mp3" }
      - { who: "mese", at: 251.9, do: "emote", expression: "surprised", duration: 2.72 }
      - { who: "defne", at: 254.02, do: "walk_to", to: [35.68, 41.21], speed: 4.2, road: true, lane: 0.0, clip: "run" }
      - { who: "defne", at: 254.17, do: "talk", duration: 1.65, text: "Merak etme, hemen dönerim!", audio: "audio/bolum-1-ormanin-bekcileri/defne_3f89dec777.mp3" }
      - { who: "toprak", at: 256.02, do: "talk", duration: 1.23, text: "Hep böyle yapıyor.", audio: "audio/bolum-1-ormanin-bekcileri/toprak_b70d02d999.mp3" }
      - { who: "mese", at: 257.29, do: "look_at", target: "camera", duration: 2.12 }
      - { who: "mese", at: 257.49, do: "talk", duration: 1.72, text: "Hadi, peşinden gidelim.", audio: "audio/bolum-1-ormanin-bekcileri/mese_b32314ba66.mp3" }
      - { who: "toprak", at: 259.21, do: "walk_to", to: [37.27, 39.85], speed: 3.4, road: true, lane: 1.2, clip: "run" }
      - { who: "mese", at: 259.31, do: "walk_to", to: [37.09, 42.28], speed: 3.4, road: true, lane: -1.2, clip: "run" }
      - { who: "defne", at: 259.81, do: "talk", duration: 1.72, text: "Toprak! Meşe! Çabuk gelin!", audio: "audio/bolum-1-ormanin-bekcileri/defne_e96541abe5.mp3" }
      - { who: "defne", at: 259.81, do: "emote", expression: "surprised", duration: 2.32 }
      - { who: "toprak", at: 261.77, do: "talk", duration: 1.7, text: "Ne oldu? Bir şey mi var?", audio: "audio/bolum-1-ormanin-bekcileri/toprak_ed1fc25b8c.mp3" }
      - { who: "defne", at: 263.47, do: "turn", to: -84.1, duration: 0.45 }
      - { who: "mese", at: 263.47, do: "turn", to: -84.1, duration: 0.5 }
      - { who: "toprak", at: 263.47, do: "turn", to: -84.1, duration: 0.5 }
      - { who: "defne", at: 263.67, do: "talk", duration: 0.89, text: "Şuna bakın...", audio: "audio/bolum-1-ormanin-bekcileri/defne_e851f0879a.mp3" }
      - { who: "defne", at: 264.56, do: "emote", expression: "surprised", duration: 2.4 }
      - { who: "mese", at: 264.56, do: "emote", expression: "surprised", duration: 2.4 }
      - { who: "toprak", at: 264.56, do: "emote", expression: "surprised", duration: 2.4 }
      - { who: "defne", at: 267.16, do: "look_at", target: "toprak", duration: 2.65 }
      - { who: "toprak", at: 267.31, do: "talk", duration: 2.35, text: "Koca çam... devrilmiş!", audio: "audio/bolum-1-ormanin-bekcileri/toprak_2006a2be88.mp3" }
      - { who: "mese", at: 269.7, do: "look_at", target: "camera", duration: 2.05 }
      - { who: "defne", at: 269.75, do: "look_at", target: "mese", duration: 4.59 }
      - { who: "toprak", at: 269.75, do: "look_at", target: "mese", duration: 1.95 }
      - { who: "mese", at: 269.9, do: "talk", duration: 1.65, text: "Yolu tamamen kapatmış.", audio: "audio/bolum-1-ormanin-bekcileri/mese_2d63eb6aca.mp3" }
      - { who: "toprak", at: 271.64, do: "look_at", target: "defne", duration: 5.74 }
      - { who: "defne", at: 271.79, do: "talk", duration: 1.96, text: "Dün akşam buradan geçtim. Dimdikti!", audio: "audio/bolum-1-ormanin-bekcileri/defne_247d40cf8b.mp3" }
      - { who: "defne", at: 273.84, do: "look_at", target: "toprak", duration: 3.1 }
      - { who: "toprak", at: 273.99, do: "talk", duration: 2.8, text: "Bir gecede nasıl devrilir ki böyle bir ağaç?", audio: "audio/bolum-1-ormanin-bekcileri/toprak_681494d114.mp3" }
      - { who: "mese", at: 276.83, do: "look_at", target: "camera", duration: 2.59 }
      - { who: "defne", at: 276.88, do: "look_at", target: "mese", duration: 4.59 }
      - { who: "toprak", at: 276.88, do: "look_at", target: "mese", duration: 3.04 }
      - { who: "mese", at: 277.03, do: "talk", duration: 2.19, text: "Yaklaşalım. Ama dikkatli olun.", audio: "audio/bolum-1-ormanin-bekcileri/mese_d5ec8e97d1.mp3" }
      - { who: "toprak", at: 279.22, do: "walk_to", to: [31.0, 36.6], speed: 1.45 }
      - { who: "mese", at: 279.32, do: "walk_to", to: [32.2, 39.4], speed: 1.45 }
      - { who: "defne", at: 279.42, do: "walk_to", to: [32.4, 42.6], speed: 1.45 }
      - { who: "toprak", at: 279.42, do: "look_at", target: "defne", duration: 1.61 }
      - { who: "defne", at: 279.57, do: "talk", duration: 1.31, text: "Belki fırtına olmuştur?", audio: "audio/bolum-1-ormanin-bekcileri/defne_ca404b34a6.mp3" }
      - { who: "mese", at: 280.92, do: "look_at", target: "camera", duration: 3.06 }
      - { who: "defne", at: 280.97, do: "look_at", target: "mese", duration: 5.66 }
      - { who: "toprak", at: 280.97, do: "look_at", target: "mese", duration: 2.96 }
      - { who: "mese", at: 281.12, do: "talk", duration: 2.66, text: "Dün gece fırtına yoktu. Gökyüzü tertemizdi.", audio: "audio/bolum-1-ormanin-bekcileri/mese_efe93c5d80.mp3" }
      - { who: "toprak", at: 283.87, do: "look_at", target: "defne", duration: 2.31 }
      - { who: "defne", at: 284.02, do: "talk", duration: 2.01, text: "Doğru. Rüzgâr olsaydı, ben bilirdim.", audio: "audio/bolum-1-ormanin-bekcileri/defne_3b74e1583f.mp3" }
      - { who: "defne", at: 286.03, do: "turn", to: "toprak", duration: 0.5 }
      - { who: "mese", at: 286.03, do: "turn", to: "toprak", duration: 0.5 }
      - { who: "toprak", at: 286.03, do: "turn", to: -119.1, duration: 0.5 }
      - { who: "defne", at: 286.13, do: "look_at", target: "toprak", duration: 4.51 }
      - { who: "toprak", at: 286.23, do: "clip", name: "point", duration: 7.5, loop: false, fade: 0.35 }
      - { who: "toprak", at: 286.28, do: "talk", duration: 4.21, text: "Bakın, kökleri sağlam. Toprağın altında hâlâ duruyorlar.", audio: "audio/bolum-1-ormanin-bekcileri/toprak_ad58670e2f.mp3" }
      - { who: "mese", at: 290.53, do: "look_at", target: "camera", duration: 2.7 }
      - { who: "defne", at: 290.58, do: "look_at", target: "mese", duration: 2.6 }
      - { who: "toprak", at: 290.58, do: "look_at", target: "mese", duration: 2.6 }
      - { who: "mese", at: 290.73, do: "talk", duration: 2.3, text: "Yani ağaç kökünden sökülmemiş.", audio: "audio/bolum-1-ormanin-bekcileri/mese_ce1db2508b.mp3" }
      - { who: "defne", at: 293.12, do: "look_at", target: "toprak", duration: 6.49 }
      - { who: "toprak", at: 293.27, do: "talk", duration: 3.21, text: "Hayır. Gövdesi... kesilmiş gibi.", audio: "audio/bolum-1-ormanin-bekcileri/toprak_cc9fcf932a.mp3" }
      - { who: "mese", at: 296.57, do: "look_at", target: "defne", duration: 2.6 }
      - { who: "toprak", at: 296.57, do: "look_at", target: "defne", duration: 2.6 }
      - { who: "defne", at: 296.72, do: "talk", duration: 2.3, text: "Kesilmiş mi? Kim keser ki koca bir çamı?", audio: "audio/bolum-1-ormanin-bekcileri/defne_d79dfb7457.mp3" }
      - { who: "defne", at: 296.72, do: "emote", expression: "surprised", duration: 2.9 }
      - { who: "defne", at: 299.11, do: "look_at", target: "toprak", duration: 3.25 }
      - { who: "toprak", at: 299.26, do: "talk", duration: 2.95, text: "Kesik çok düzgün. Bıçakla kesilmiş gibi pürüzsüz.", audio: "audio/bolum-1-ormanin-bekcileri/toprak_45791dfc21.mp3" }
      - { who: "mese", at: 302.26, do: "look_at", target: "camera", duration: 3.25 }
      - { who: "defne", at: 302.31, do: "look_at", target: "mese", duration: 6.08 }
      - { who: "toprak", at: 302.31, do: "look_at", target: "mese", duration: 3.15 }
      - { who: "mese", at: 302.46, do: "talk", duration: 2.85, text: "Kenarları da kararmış. Sanki... yanmış.", audio: "audio/bolum-1-ormanin-bekcileri/mese_12650bd3e7.mp3" }
      - { who: "toprak", at: 305.4, do: "look_at", target: "defne", duration: 5.11 }
      - { who: "defne", at: 305.55, do: "talk", duration: 2.25, text: "Yanmış mı? Ama etrafta hiç yangın izi yok.", audio: "audio/bolum-1-ormanin-bekcileri/defne_60ed7c85b0.mp3" }
      - { who: "defne", at: 307.89, do: "look_at", target: "toprak", duration: 2.18 }
      - { who: "toprak", at: 308.04, do: "talk", duration: 1.88, text: "Bir koku var... Duman gibi.", audio: "audio/bolum-1-ormanin-bekcileri/toprak_47137412fe.mp3" }
      - { who: "mese", at: 309.96, do: "look_at", target: "camera", duration: 2.36 }
      - { who: "defne", at: 310.01, do: "look_at", target: "mese", duration: 4.4 }
      - { who: "toprak", at: 310.01, do: "look_at", target: "mese", duration: 2.26 }
      - { who: "mese", at: 310.16, do: "talk", duration: 1.96, text: "Evet, ben de alıyorum. Çok hafif.", audio: "audio/bolum-1-ormanin-bekcileri/mese_a46107633f.mp3" }
      - { who: "toprak", at: 312.21, do: "look_at", target: "defne", duration: 1.76 }
      - { who: "defne", at: 312.36, do: "talk", duration: 1.46, text: "Yoksa bir yıldırım mı düştü?", audio: "audio/bolum-1-ormanin-bekcileri/defne_b62049daff.mp3" }
      - { who: "mese", at: 313.86, do: "look_at", target: "camera", duration: 4.0 }
      - { who: "defne", at: 313.91, do: "look_at", target: "mese", duration: 4.4 }
      - { who: "toprak", at: 313.91, do: "look_at", target: "mese", duration: 6.1 }
      - { who: "mese", at: 314.06, do: "talk", duration: 3.6, text: "Yıldırım ağacı yarar, parçalar. Böyle düzgün kesmez.", audio: "audio/bolum-1-ormanin-bekcileri/mese_4921c28ef4.mp3" }
      - { who: "defne", at: 317.81, do: "look_at", target: "toprak", duration: 1.76 }
      - { who: "toprak", at: 317.96, do: "talk", duration: 1.46, text: "O zaman bunu biri yaptı.", audio: "audio/bolum-1-ormanin-bekcileri/toprak_673a844389.mp3" }
      - { who: "mese", at: 319.51, do: "look_at", target: "defne", duration: 2.3 }
      - { who: "toprak", at: 319.51, do: "look_at", target: "defne", duration: 2.3 }
      - { who: "defne", at: 319.66, do: "talk", duration: 1.1, text: "Ama kim? Neden?", audio: "audio/bolum-1-ormanin-bekcileri/defne_c37f3e392e.mp3" }
      - { who: "mese", at: 321.31, do: "look_at", target: "defne", duration: 3.27 }
      - { who: "toprak", at: 321.31, do: "look_at", target: "defne", duration: 2.23 }
      - { who: "defne", at: 321.46, do: "talk", duration: 1.93, text: "Ne o?! Arkada bir şey kıpırdadı!", audio: "audio/bolum-1-ormanin-bekcileri/defne_285e8d035b.mp3" }
      - { who: "defne", at: 321.46, do: "emote", expression: "surprised", duration: 2.53 }
      - { who: "defne", at: 321.46, do: "clip", name: "mma_kick", duration: 1.58, loop: false, fade: 0.3 }
      - { who: "mese", at: 321.56, do: "clip", name: "equip_bow", duration: 0.88, loop: false, fade: 0.2 }
      - { who: "toprak", at: 321.66, do: "clip", name: "crouch_to_stand", duration: 2.0, loop: false, fade: 0.25 }
      - { who: "mese", at: 322.41, do: "clip", name: "aim_overdraw", duration: 2.6, loop: false, fade: 0.2 }
      - { who: "defne", at: 322.96, do: "clip", name: "fight_idle", duration: 2.4, loop: true, fade: 0.25 }
      - { who: "defne", at: 324.08, do: "look_at", target: "toprak", duration: 6.79 }
      - { who: "mese", at: 324.08, do: "look_at", target: "toprak", duration: 3.57 }
      - { who: "toprak", at: 324.23, do: "talk", duration: 3.27, text: "Bir yaprak, Defne. Sadece bir yaprak.", audio: "audio/bolum-1-ormanin-bekcileri/toprak_43246d60af.mp3" }
      - { who: "mese", at: 327.5, do: "clip", name: "disarm_bow", duration: 1.08, loop: false, fade: 0.2 }
      - { who: "toprak", at: 327.59, do: "look_at", target: "defne", duration: 2.83 }
      - { who: "defne", at: 327.74, do: "talk", duration: 2.53, text: "Biliyordum... Seni denedim sadece.", audio: "audio/bolum-1-ormanin-bekcileri/defne_4014b664bb.mp3" }
      - { who: "mese", at: 330.32, do: "look_at", target: "camera", duration: 3.2 }
      - { who: "defne", at: 330.37, do: "look_at", target: "mese", duration: 3.65 }
      - { who: "toprak", at: 330.37, do: "look_at", target: "mese", duration: 6.19 }
      - { who: "mese", at: 330.52, do: "talk", duration: 2.8, text: "Korkmak ayıp değil. Ama aklımızı kullanalım.", audio: "audio/bolum-1-ormanin-bekcileri/mese_9b15084306.mp3" }
      - { who: "defne", at: 333.52, do: "look_at", target: "toprak", duration: 2.6 }
      - { who: "mese", at: 333.52, do: "look_at", target: "toprak", duration: 2.6 }
      - { who: "toprak", at: 333.67, do: "talk", duration: 2.3, text: "Durun... Burada başka izler de var.", audio: "audio/bolum-1-ormanin-bekcileri/toprak_3e32a95a20.mp3" }
      - { who: "toprak", at: 333.67, do: "emote", expression: "surprised", duration: 2.9 }
      - { who: "toprak", at: 335.97, do: "walk_to", to: [33.0, 34.4], speed: 1.4 }
      - { who: "mese", at: 336.06, do: "look_at", target: "defne", duration: 1.58 }
      - { who: "toprak", at: 336.06, do: "look_at", target: "defne", duration: 1.58 }
      - { who: "mese", at: 336.07, do: "walk_to", to: [34.2, 36.0], speed: 1.4 }
      - { who: "defne", at: 336.17, do: "walk_to", to: [35.0, 37.6], speed: 1.4 }
      - { who: "defne", at: 336.21, do: "talk", duration: 1.28, text: "Geyik izi mi yine?", audio: "audio/bolum-1-ormanin-bekcileri/defne_168212c160.mp3" }
      - { who: "defne", at: 340.2, do: "look_at", target: [33.0, 17.2, 33.6], duration: 4.5 }
      - { who: "mese", at: 340.2, do: "look_at", target: [33.0, 17.2, 33.6], duration: 4.5 }
      - { who: "toprak", at: 340.2, do: "clip", name: "point", duration: 5.0, loop: false, fade: 0.35 }
      - { who: "toprak", at: 340.4, do: "talk", duration: 5.41, text: "Hayır. Bunlar ayakkabı izi. Hem de çok büyük... Bir yetişkininki gibi.", audio: "audio/bolum-1-ormanin-bekcileri/toprak_64b210e5e9.mp3" }
      - { who: "mese", at: 345.85, do: "look_at", target: "camera", duration: 3.3 }
      - { who: "mese", at: 346.05, do: "talk", duration: 2.9, text: "Ve ağır basmış. Toprak iyice çökmüş.", audio: "audio/bolum-1-ormanin-bekcileri/mese_f9da61097c.mp3" }
      - { who: "toprak", at: 349.04, do: "look_at", target: "defne", duration: 2.31 }
      - { who: "defne", at: 349.19, do: "talk", duration: 2.01, text: "Ormanda bizden başka kim dolaşır ki?", audio: "audio/bolum-1-ormanin-bekcileri/defne_d46d734758.mp3" }
      - { who: "defne", at: 351.29, do: "look_at", target: "toprak", duration: 5.97 }
      - { who: "mese", at: 351.29, do: "look_at", target: "toprak", duration: 3.7 }
      - { who: "toprak", at: 351.44, do: "talk", duration: 3.4, text: "İzler çalılığa doğru gidiyor... Sonra kayboluyor.", audio: "audio/bolum-1-ormanin-bekcileri/toprak_95ec6c58a3.mp3" }
      - { who: "toprak", at: 354.93, do: "look_at", target: "defne", duration: 1.89 }
      - { who: "defne", at: 355.08, do: "talk", duration: 1.59, text: "Takip edelim! Hemen yakalarız!", audio: "audio/bolum-1-ormanin-bekcileri/defne_93780697c5.mp3" }
      - { who: "defne", at: 355.08, do: "emote", expression: "happy", duration: 2.19 }
      - { who: "mese", at: 356.71, do: "look_at", target: "camera", duration: 4.55 }
      - { who: "defne", at: 356.76, do: "look_at", target: "mese", duration: 4.45 }
      - { who: "toprak", at: 356.76, do: "look_at", target: "mese", duration: 4.45 }
      - { who: "mese", at: 356.91, do: "talk", duration: 4.15, text: "Hayır. Önce ağaç. O beklerse kurur, izler ise kaçmaz.", audio: "audio/bolum-1-ormanin-bekcileri/mese_4ed63259a8.mp3" }
      - { who: "defne", at: 361.15, do: "look_at", target: "toprak", duration: 3.28 }
      - { who: "toprak", at: 361.3, do: "talk", duration: 2.98, text: "Meşe haklı. Önce ağacı kurtaralım.", audio: "audio/bolum-1-ormanin-bekcileri/toprak_de59ae0349.mp3" }
      - { who: "mese", at: 364.37, do: "look_at", target: "defne", duration: 3.15 }
      - { who: "toprak", at: 364.37, do: "look_at", target: "defne", duration: 3.15 }
      - { who: "defne", at: 364.52, do: "talk", duration: 2.85, text: "Peki... Ama sonra o izlerin peşine düşüyoruz!", audio: "audio/bolum-1-ormanin-bekcileri/defne_315ecb7bef.mp3" }
      - { who: "toprak", at: 367.37, do: "walk_to", to: [31.0, 36.6], speed: 1.45 }
      - { who: "mese", at: 367.47, do: "walk_to", to: [32.2, 39.4], speed: 1.45 }
      - { who: "defne", at: 367.57, do: "walk_to", to: [32.4, 42.6], speed: 1.45 }
      - { who: "mese", at: 371.51, do: "turn", to: -60.3, duration: 0.5 }
      - { who: "mese", at: 371.55, do: "look_at", target: "camera", duration: 4.03 }
      - { who: "defne", at: 371.6, do: "look_at", target: "mese", duration: 3.93 }
      - { who: "toprak", at: 371.6, do: "look_at", target: "mese", duration: 5.97 }
      - { who: "mese", at: 371.75, do: "talk", duration: 3.63, text: "Bu ağaç hâlâ yaşıyor. Reçinesi taze, kökleri nemli.", audio: "audio/bolum-1-ormanin-bekcileri/mese_abd3d53dbe.mp3" }
      - { who: "defne", at: 375.47, do: "look_at", target: "toprak", duration: 1.66 }
      - { who: "toprak", at: 375.62, do: "talk", duration: 1.36, text: "Yani kurtarabilir miyiz?", audio: "audio/bolum-1-ormanin-bekcileri/toprak_ec889cb6e2.mp3" }
      - { who: "toprak", at: 375.62, do: "emote", expression: "happy", duration: 1.96 }
      - { who: "mese", at: 377.02, do: "look_at", target: "camera", duration: 3.35 }
      - { who: "defne", at: 377.07, do: "look_at", target: "mese", duration: 3.25 }
      - { who: "toprak", at: 377.07, do: "look_at", target: "mese", duration: 3.25 }
      - { who: "mese", at: 377.22, do: "talk", duration: 2.95, text: "Hemen kökünün üstüne dikilirse, iyileşebilir.", audio: "audio/bolum-1-ormanin-bekcileri/mese_af29e08c49.mp3" }
      - { who: "defne", at: 380.26, do: "look_at", target: "toprak", duration: 6.7 }
      - { who: "toprak", at: 380.41, do: "talk", duration: 3.19, text: "Ama bu ağaç çok ağır! Üçümüz bile kaldıramayız.", audio: "audio/bolum-1-ormanin-bekcileri/toprak_c7d1d0b8b2.mp3" }
      - { who: "mese", at: 383.69, do: "look_at", target: "defne", duration: 2.83 }
      - { who: "toprak", at: 383.69, do: "look_at", target: "defne", duration: 5.63 }
      - { who: "defne", at: 383.84, do: "talk", duration: 2.53, text: "Siz kaldıramazsınız. Ama rüzgâr kaldırır!", audio: "audio/bolum-1-ormanin-bekcileri/defne_de6ba07189.mp3" }
      - { who: "defne", at: 383.84, do: "emote", expression: "happy", duration: 3.13 }
      - { who: "defne", at: 386.46, do: "look_at", target: "toprak", duration: 5.41 }
      - { who: "mese", at: 386.46, do: "look_at", target: "toprak", duration: 2.42 }
      - { who: "toprak", at: 386.61, do: "talk", duration: 2.12, text: "Ciddi misin? Bu koca çamı mı?", audio: "audio/bolum-1-ormanin-bekcileri/toprak_19c38c4705.mp3" }
      - { who: "toprak", at: 388.82, do: "look_at", target: "defne", duration: 2.65 }
      - { who: "defne", at: 388.97, do: "talk", duration: 2.35, text: "Hiç bu kadar ciddi olmamıştım. Geri çekilin!", audio: "audio/bolum-1-ormanin-bekcileri/defne_f98e433856.mp3" }
      - { who: "mese", at: 391.32, do: "look_at", target: "camera", duration: 3.77 }
      - { who: "toprak", at: 391.32, do: "walk_to", to: [33.4, 37.0], speed: 1.5 }
      - { who: "defne", at: 391.37, do: "look_at", target: "mese", duration: 3.67 }
      - { who: "toprak", at: 391.37, do: "look_at", target: "mese", duration: 3.67 }
      - { who: "mese", at: 391.42, do: "walk_to", to: [34.2, 39.6], speed: 1.5 }
      - { who: "defne", at: 391.52, do: "walk_to", to: [34.6, 42.2], speed: 1.5 }
      - { who: "mese", at: 391.52, do: "talk", duration: 3.37, text: "Dikkatli ol Defne. Yavaşça, kökünün tam üstüne.", audio: "audio/bolum-1-ormanin-bekcileri/mese_4b87674750.mp3" }
      - { who: "defne", at: 395.09, do: "talk", duration: 1.31, text: "Rüzgâr, bana güç ver!", audio: "audio/bolum-1-ormanin-bekcileri/defne_fe5d847ba1.mp3" }
      - { who: "defne", at: 395.09, do: "emote", expression: "angry", duration: 1.91 }
      - { who: "defne", at: 396.4, do: "ability", name: "agac_dikme", target: "Realistic_Pine_059" }
      - { who: "mese", at: 396.4, do: "look_at", target: [29.4, 21.2, 41.0], duration: 6.5 }
      - { who: "toprak", at: 396.4, do: "look_at", target: [29.4, 21.2, 41.0], duration: 6.5 }
      - { who: "mese", at: 401.2, do: "emote", expression: "happy", duration: 2.4 }
      - { who: "toprak", at: 401.2, do: "clip", name: "jump_joy", duration: 2.2, loop: true, fade: 0.3 }
      - { who: "defne", at: 402.55, do: "look_at", target: "toprak", duration: 2.55 }
      - { who: "defne", at: 402.6, do: "turn", to: "toprak", duration: 0.5 }
      - { who: "toprak", at: 402.7, do: "talk", duration: 2.25, text: "Vay canına! Yaptı!", audio: "audio/bolum-1-ormanin-bekcileri/toprak_3337db916b.mp3" }
      - { who: "toprak", at: 402.7, do: "emote", expression: "happy", duration: 2.85 }
      - { who: "mese", at: 404.99, do: "look_at", target: "camera", duration: 2.7 }
      - { who: "defne", at: 405.04, do: "look_at", target: "mese", duration: 2.6 }
      - { who: "toprak", at: 405.04, do: "look_at", target: "mese", duration: 2.6 }
      - { who: "mese", at: 405.19, do: "talk", duration: 2.3, text: "Tam yerine oturdu. Aferin Defne.", audio: "audio/bolum-1-ormanin-bekcileri/mese_440cbf44d8.mp3" }
      - { who: "mese", at: 405.19, do: "emote", expression: "happy", duration: 2.9 }
      - { who: "toprak", at: 407.58, do: "look_at", target: "defne", duration: 5.33 }
      - { who: "defne", at: 407.73, do: "talk", duration: 1.88, text: "Söylemiştim! Rüzgâr benim kanadım!", audio: "audio/bolum-1-ormanin-bekcileri/defne_1d96b60ef8.mp3" }
      - { who: "defne", at: 407.73, do: "emote", expression: "happy", duration: 2.48 }
      - { who: "defne", at: 407.73, do: "clip", name: "breakdance", duration: 3.2, loop: false, fade: 0.3 }
      - { who: "defne", at: 409.61, do: "clip", name: "hip_hop", duration: 2.6, loop: false, fade: 0.3 }
      - { who: "mese", at: 409.61, do: "emote", expression: "happy", duration: 2.6 }
      - { who: "toprak", at: 409.61, do: "clip", name: "jump_joy", duration: 2.6, loop: true, fade: 0.3 }
      - { who: "mese", at: 411.81, do: "ability", name: "dalga_gosterisi" }
      - { who: "mese", at: 412.36, do: "look_at", target: "camera", duration: 2.96 }
      - { who: "defne", at: 412.41, do: "look_at", target: "mese", duration: 3.91 }
      - { who: "toprak", at: 412.41, do: "look_at", target: "mese", duration: 6.32 }
      - { who: "mese", at: 412.56, do: "talk", duration: 2.56, text: "Şimdi biraz su. Yarası kapansın.", audio: "audio/bolum-1-ormanin-bekcileri/mese_081219c2bc.mp3" }
      - { who: "toprak", at: 415.12, do: "ability", name: "kaya_yukselisi" }
      - { who: "defne", at: 415.82, do: "look_at", target: "toprak", duration: 5.08 }
      - { who: "mese", at: 415.82, do: "look_at", target: "toprak", duration: 2.91 }
      - { who: "toprak", at: 415.97, do: "talk", duration: 2.06, text: "Ben de kökünü toprakla sarayım.", audio: "audio/bolum-1-ormanin-bekcileri/toprak_0f57f73ca2.mp3" }
      - { who: "mese", at: 418.23, do: "look_at", target: "defne", duration: 2.23 }
      - { who: "toprak", at: 418.23, do: "look_at", target: "defne", duration: 4.56 }
      - { who: "defne", at: 418.38, do: "talk", duration: 1.93, text: "Bak, şimdiden daha mutlu görünüyor!", audio: "audio/bolum-1-ormanin-bekcileri/defne_37065b075d.mp3" }
      - { who: "defne", at: 420.4, do: "look_at", target: "toprak", duration: 1.95 }
      - { who: "toprak", at: 420.55, do: "talk", duration: 1.65, text: "Ağaçlar mutlu olur mu?", audio: "audio/bolum-1-ormanin-bekcileri/toprak_37030ea21f.mp3" }
      - { who: "mese", at: 422.24, do: "look_at", target: "camera", duration: 3.95 }
      - { who: "defne", at: 422.29, do: "look_at", target: "mese", duration: 6.79 }
      - { who: "toprak", at: 422.29, do: "look_at", target: "mese", duration: 5.19 }
      - { who: "mese", at: 422.44, do: "talk", duration: 3.55, text: "Elbette. Dinlersen, teşekkür ettiğini duyarsın.", audio: "audio/bolum-1-ormanin-bekcileri/mese_68618da79d.mp3" }
      - { who: "mese", at: 426.98, do: "look_at", target: "defne", duration: 1.66 }
      - { who: "toprak", at: 426.98, do: "look_at", target: "defne", duration: 3.8 }
      - { who: "defne", at: 427.13, do: "talk", duration: 1.36, text: "Duydum! Hışırdadı!", audio: "audio/bolum-1-ormanin-bekcileri/defne_98061976a3.mp3" }
      - { who: "defne", at: 427.13, do: "emote", expression: "happy", duration: 1.96 }
      - { who: "defne", at: 428.58, do: "look_at", target: "toprak", duration: 4.98 }
      - { who: "mese", at: 428.58, do: "look_at", target: "toprak", duration: 1.76 }
      - { who: "toprak", at: 428.73, do: "talk", duration: 1.46, text: "Bence o sadece rüzgârdı.", audio: "audio/bolum-1-ormanin-bekcileri/toprak_6a3f65e06b.mp3" }
      - { who: "mese", at: 430.28, do: "look_at", target: "defne", duration: 2.08 }
      - { who: "toprak", at: 430.28, do: "look_at", target: "defne", duration: 3.28 }
      - { who: "defne", at: 430.43, do: "talk", duration: 1.78, text: "Rüzgâr da benim, teşekkür de!", audio: "audio/bolum-1-ormanin-bekcileri/defne_cb343e5916.mp3" }
      - { who: "mese", at: 433.01, do: "look_at", target: "camera", duration: 1.94 }
      - { who: "defne", at: 433.06, do: "look_at", target: "mese", duration: 3.48 }
      - { who: "toprak", at: 433.06, do: "look_at", target: "mese", duration: 1.84 }
      - { who: "mese", at: 433.21, do: "talk", duration: 1.54, text: "Şşş! Dinleyin...", audio: "audio/bolum-1-ormanin-bekcileri/mese_08d069850b.mp3" }
      - { who: "mese", at: 433.21, do: "emote", expression: "surprised", duration: 2.14 }
      - { who: "defne", at: 436.04, do: "look_at", target: "toprak", duration: 5.42 }
      - { who: "mese", at: 436.04, do: "look_at", target: "toprak", duration: 2.6 }
      - { who: "toprak", at: 436.19, do: "talk", duration: 2.3, text: "Kuşlar! Kuşlar geri döndü!", audio: "audio/bolum-1-ormanin-bekcileri/toprak_ac2cea4cda.mp3" }
      - { who: "toprak", at: 436.19, do: "emote", expression: "happy", duration: 2.9 }
      - { who: "toprak", at: 436.19, do: "clip", name: "jump_joy", duration: 1.85, loop: false, fade: 0.3 }
      - { who: "toprak", at: 438.58, do: "look_at", target: "defne", duration: 2.44 }
      - { who: "defne", at: 438.73, do: "talk", duration: 2.14, text: "Demek onlar da ağaç için endişelenmiş.", audio: "audio/bolum-1-ormanin-bekcileri/defne_5664d850f1.mp3" }
      - { who: "mese", at: 440.91, do: "look_at", target: "camera", duration: 4.21 }
      - { who: "defne", at: 440.96, do: "look_at", target: "mese", duration: 4.11 }
      - { who: "toprak", at: 440.96, do: "look_at", target: "mese", duration: 7.04 }
      - { who: "mese", at: 441.11, do: "talk", duration: 3.81, text: "Orman tek bir aile gibidir. Biri incinirse, hepsi hisseder.", audio: "audio/bolum-1-ormanin-bekcileri/mese_69cbc3285e.mp3" }
      - { who: "defne", at: 445.01, do: "look_at", target: "toprak", duration: 2.55 }
      - { who: "toprak", at: 445.16, do: "talk", duration: 2.25, text: "O zaman geyikler de geri gelir, değil mi?", audio: "audio/bolum-1-ormanin-bekcileri/toprak_0997d584f4.mp3" }
      - { who: "mese", at: 447.45, do: "look_at", target: "camera", duration: 2.41 }
      - { who: "defne", at: 447.5, do: "look_at", target: "mese", duration: 3.01 }
      - { who: "toprak", at: 447.5, do: "look_at", target: "mese", duration: 3.01 }
      - { who: "mese", at: 447.65, do: "talk", duration: 2.01, text: "Gelirler. Korkuları geçince.", audio: "audio/bolum-1-ormanin-bekcileri/mese_a4f431a6d2.mp3" }
      - { who: "mese", at: 449.96, do: "look_at", target: "camera", duration: 2.7 }

      - { who: "mese", at: 236.98, do: "talk", duration: 3.4, text: "İkiniz de iyiydiniz. Hızlı da olmalı, dikkatli de.", audio: "audio/bolum-1-ormanin-bekcileri/mese_659e4d63dd.mp3" }
      - { who: "mese", at: 236.98, do: "emote", expression: "happy", duration: 3.5 }
      - { who: "mese", at: 240.95, do: "look_at", target: "defne", duration: 2.53 }
      - { who: "toprak", at: 240.95, do: "look_at", target: "defne", duration: 1.61 }
      - { who: "defne", at: 241.1, do: "talk", duration: 1.31, text: "Duydun mu? Hızlı!", audio: "audio/bolum-1-ormanin-bekcileri/defne_ed061f1fa2.mp3" }
      - { who: "defne", at: 242.98, do: "look_at", target: "toprak", duration: 1.95 }
      - { who: "mese", at: 242.98, do: "look_at", target: "toprak", duration: 1.95 }
      - { who: "toprak", at: 243.13, do: "talk", duration: 1.65, text: "Duydum. Dikkatli!", audio: "audio/bolum-1-ormanin-bekcileri/toprak_e7aee028c9.mp3" }
      - { who: "defne", at: 245.08, do: "walk_to", to: [49.56, 40.55], speed: 0.95, road: true, lane: 0.0 }
      - { who: "toprak", at: 245.2, do: "walk_to", to: [49.16, 39.25], speed: 0.95, road: true, lane: 1.3 }
      - { who: "mese", at: 245.32, do: "walk_to", to: [48.76, 41.85], speed: 0.95, road: true, lane: -1.3 }
      - { who: "defne", at: 252.65, do: "look_at", target: "toprak", duration: 3.7 }
      - { who: "mese", at: 252.65, do: "look_at", target: "toprak", duration: 2.78 }
      - { who: "toprak", at: 252.8, do: "talk", duration: 2.48, text: "Meşe, sen ormanı nasıl dinliyorsun?", audio: "audio/bolum-1-ormanin-bekcileri/toprak_4cb9d02549.mp3" }
      - { who: "mese", at: 255.8, do: "look_at", target: "camera", duration: 3.59 }
      - { who: "defne", at: 255.85, do: "look_at", target: "mese", duration: 3.49 }
      - { who: "toprak", at: 255.85, do: "look_at", target: "mese", duration: 4.41 }
      - { who: "mese", at: 256.0, do: "talk", duration: 3.19, text: "Su gibi. Sessizce akarsın, her sesi duyarsın.", audio: "audio/bolum-1-ormanin-bekcileri/mese_940650e941.mp3" }
      - { who: "mese", at: 259.76, do: "look_at", target: "defne", duration: 3.88 }
      - { who: "toprak", at: 259.76, do: "look_at", target: "defne", duration: 2.96 }
      - { who: "defne", at: 259.91, do: "talk", duration: 2.66, text: "Ben de rüzgâr gibi dinlerim. Her yere bir anda!", audio: "audio/bolum-1-ormanin-bekcileri/defne_033d7211f9.mp3" }
      - { who: "defne", at: 263.14, do: "look_at", target: "toprak", duration: 5.74 }
      - { who: "mese", at: 263.14, do: "look_at", target: "toprak", duration: 4.82 }
      - { who: "toprak", at: 263.29, do: "talk", duration: 4.52, text: "Ben de toprak gibi. Ayağımın altında her adımı hissederim.", audio: "audio/bolum-1-ormanin-bekcileri/toprak_8957165c8a.mp3" }
      - { who: "mese", at: 268.33, do: "look_at", target: "camera", duration: 2.75 }
      - { who: "defne", at: 268.38, do: "look_at", target: "mese", duration: 2.65 }
      - { who: "toprak", at: 268.38, do: "look_at", target: "mese", duration: 3.85 }
      - { who: "mese", at: 268.53, do: "talk", duration: 2.35, text: "İşte bu yüzden birlikte güçlüyüz.", audio: "audio/bolum-1-ormanin-bekcileri/mese_12d12b9afe.mp3" }
      - { who: "mese", at: 271.73, do: "look_at", target: "defne", duration: 2.42 }
      - { who: "toprak", at: 271.73, do: "look_at", target: "defne", duration: 3.34 }
      - { who: "defne", at: 271.88, do: "talk", duration: 2.12, text: "Meşe, senin en sevdiğin ağaç hangisi?", audio: "audio/bolum-1-ormanin-bekcileri/defne_01199fa557.mp3" }
      - { who: "mese", at: 274.52, do: "look_at", target: "camera", duration: 4.87 }
      - { who: "defne", at: 274.57, do: "look_at", target: "mese", duration: 5.69 }
      - { who: "toprak", at: 274.57, do: "look_at", target: "mese", duration: 4.77 }
      - { who: "mese", at: 274.72, do: "talk", duration: 4.47, text: "Adımı aldığım ağaç. Meşe. Yüz yıl yaşar, hep sabırlıdır.", audio: "audio/bolum-1-ormanin-bekcileri/mese_20c885e092.mp3" }
      - { who: "defne", at: 279.76, do: "look_at", target: "toprak", duration: 2.73 }
      - { who: "mese", at: 279.76, do: "look_at", target: "toprak", duration: 3.65 }
      - { who: "toprak", at: 279.91, do: "talk", duration: 2.43, text: "Benimki çam. Kışın bile yeşil kalıyor!", audio: "audio/bolum-1-ormanin-bekcileri/toprak_1f4ffc4c59.mp3" }
      - { who: "toprak", at: 282.91, do: "look_at", target: "defne", duration: 3.88 }
      - { who: "defne", at: 283.06, do: "talk", duration: 3.08, text: "Benimki en uzun olanı. Tepesinden bütün ormanı görürüm!", audio: "audio/bolum-1-ormanin-bekcileri/defne_a6f649c082.mp3" }
      - { who: "mese", at: 286.24, do: "look_at", target: "camera", duration: 1.92 }
      - { who: "defne", at: 286.29, do: "look_at", target: "mese", duration: 2.74 }
      - { who: "toprak", at: 286.29, do: "look_at", target: "mese", duration: 4.43 }
      - { who: "mese", at: 286.44, do: "talk", duration: 1.52, text: "Şşş. Durun bir saniye.", audio: "audio/bolum-1-ormanin-bekcileri/mese_20e068c0a4.mp3" }
      - { who: "defne", at: 287.96, do: "turn", to: "mese", duration: 0.6 }
      - { who: "mese", at: 287.96, do: "clip", name: "idle_2", duration: 6.0, loop: false, fade: 0.4 }
      - { who: "toprak", at: 287.96, do: "turn", to: "mese", duration: 0.6 }
      - { who: "defne", at: 288.53, do: "look_at", target: "toprak", duration: 2.19 }
      - { who: "mese", at: 288.53, do: "look_at", target: "toprak", duration: 1.19 }
      - { who: "toprak", at: 288.68, do: "talk", duration: 0.89, text: "Ne oldu?", audio: "audio/bolum-1-ormanin-bekcileri/toprak_4685980a06.mp3" }
      - { who: "mese", at: 290.17, do: "look_at", target: "camera", duration: 2.83 }
      - { who: "defne", at: 290.22, do: "look_at", target: "mese", duration: 2.73 }
      - { who: "toprak", at: 290.22, do: "look_at", target: "mese", duration: 2.73 }
      - { who: "mese", at: 290.37, do: "talk", duration: 2.43, text: "Dinleyin. Kuşlar... Hiç ses yok.", audio: "audio/bolum-1-ormanin-bekcileri/mese_11bf96b446.mp3" }
      - { who: "mese", at: 297.77, do: "look_at", target: "defne", duration: 3.57 }
      - { who: "toprak", at: 297.77, do: "look_at", target: "defne", duration: 2.65 }
      - { who: "defne", at: 297.92, do: "talk", duration: 2.35, text: "Gerçekten. Bu saatte burası cıvıl cıvıl olur.", audio: "audio/bolum-1-ormanin-bekcileri/defne_33b47847d1.mp3" }
      - { who: "defne", at: 300.84, do: "look_at", target: "toprak", duration: 4.51 }
      - { who: "mese", at: 300.84, do: "look_at", target: "toprak", duration: 5.43 }
      - { who: "toprak", at: 300.99, do: "talk", duration: 4.21, text: "Önce geyikler, şimdi de kuşlar... Burada bir tuhaflık var.", audio: "audio/bolum-1-ormanin-bekcileri/toprak_faa7a8b9fa.mp3" }
      - { who: "mese", at: 305.77, do: "look_at", target: "defne", duration: 2.42 }
      - { who: "toprak", at: 305.77, do: "look_at", target: "defne", duration: 3.34 }
      - { who: "defne", at: 305.92, do: "talk", duration: 2.12, text: "Ben önden bakayım! Rüzgârdan hızlıyım!", audio: "audio/bolum-1-ormanin-bekcileri/defne_82e483647c.mp3" }
      - { who: "defne", at: 305.92, do: "emote", expression: "happy", duration: 2.72 }
      - { who: "mese", at: 308.56, do: "look_at", target: "camera", duration: 2.52 }
      - { who: "defne", at: 308.61, do: "look_at", target: "mese", duration: 2.42 }
      - { who: "toprak", at: 308.61, do: "look_at", target: "mese", duration: 2.42 }
      - { who: "mese", at: 308.76, do: "talk", duration: 2.12, text: "Defne, bekle! Uzaklaşma!", audio: "audio/bolum-1-ormanin-bekcileri/mese_563d5f1d56.mp3" }
      - { who: "mese", at: 308.76, do: "emote", expression: "surprised", duration: 2.72 }
      - { who: "defne", at: 310.88, do: "walk_to", to: [35.68, 41.21], speed: 3.4, road: true, lane: 0.0, clip: "run" }
      - { who: "defne", at: 311.08, do: "talk", duration: 1.65, text: "Merak etme, hemen dönerim!", audio: "audio/bolum-1-ormanin-bekcileri/defne_3f89dec777.mp3" }
      - { who: "toprak", at: 313.03, do: "talk", duration: 1.23, text: "Hep böyle yapıyor.", audio: "audio/bolum-1-ormanin-bekcileri/toprak_b70d02d999.mp3" }
      - { who: "mese", at: 314.78, do: "look_at", target: "camera", duration: 2.12 }
      - { who: "mese", at: 314.98, do: "talk", duration: 1.72, text: "Hadi, peşinden gidelim.", audio: "audio/bolum-1-ormanin-bekcileri/mese_b32314ba66.mp3" }
      - { who: "toprak", at: 316.7, do: "walk_to", to: [37.27, 39.85], speed: 2.8, road: true, lane: 1.2, clip: "run" }
      - { who: "mese", at: 316.82, do: "walk_to", to: [37.09, 42.28], speed: 2.8, road: true, lane: -1.2, clip: "run" }
      - { who: "defne", at: 317.9, do: "talk", duration: 1.72, text: "Toprak! Meşe! Çabuk gelin!", audio: "audio/bolum-1-ormanin-bekcileri/defne_e96541abe5.mp3" }
      - { who: "defne", at: 317.9, do: "emote", expression: "surprised", duration: 2.32 }
      - { who: "toprak", at: 320.34, do: "talk", duration: 1.7, text: "Ne oldu? Bir şey mi var?", audio: "audio/bolum-1-ormanin-bekcileri/toprak_ed1fc25b8c.mp3" }
      - { who: "defne", at: 322.04, do: "turn", to: -84.1, duration: 0.5 }
      - { who: "mese", at: 322.04, do: "turn", to: -84.1, duration: 0.6 }
      - { who: "toprak", at: 322.04, do: "turn", to: -84.1, duration: 0.6 }
      - { who: "defne", at: 322.34, do: "talk", duration: 0.89, text: "Şuna bakın...", audio: "audio/bolum-1-ormanin-bekcileri/defne_e851f0879a.mp3" }
      - { who: "defne", at: 323.23, do: "emote", expression: "surprised", duration: 3.0 }
      - { who: "mese", at: 323.23, do: "emote", expression: "surprised", duration: 3.0 }
      - { who: "toprak", at: 323.23, do: "emote", expression: "surprised", duration: 3.0 }
      - { who: "defne", at: 328.68, do: "look_at", target: "toprak", duration: 3.57 }
      - { who: "mese", at: 328.68, do: "look_at", target: "toprak", duration: 2.97 }
      - { who: "toprak", at: 328.83, do: "talk", duration: 2.35, text: "Koca çam... devrilmiş!", audio: "audio/bolum-1-ormanin-bekcileri/toprak_2006a2be88.mp3" }
      - { who: "mese", at: 331.7, do: "look_at", target: "camera", duration: 2.05 }
      - { who: "defne", at: 331.75, do: "look_at", target: "mese", duration: 1.95 }
      - { who: "toprak", at: 331.75, do: "look_at", target: "mese", duration: 2.87 }
      - { who: "mese", at: 331.9, do: "talk", duration: 1.65, text: "Yolu tamamen kapatmış.", audio: "audio/bolum-1-ormanin-bekcileri/mese_2d63eb6aca.mp3" }
      - { who: "mese", at: 334.12, do: "look_at", target: "defne", duration: 3.18 }
      - { who: "toprak", at: 334.12, do: "look_at", target: "defne", duration: 2.26 }
      - { who: "defne", at: 334.27, do: "talk", duration: 1.96, text: "Dün akşam buradan geçtim. Dimdikti!", audio: "audio/bolum-1-ormanin-bekcileri/defne_247d40cf8b.mp3" }
      - { who: "defne", at: 336.8, do: "look_at", target: "toprak", duration: 4.02 }
      - { who: "mese", at: 336.8, do: "look_at", target: "toprak", duration: 3.1 }
      - { who: "toprak", at: 336.95, do: "talk", duration: 2.8, text: "Bir gecede nasıl devrilir ki böyle bir ağaç?", audio: "audio/bolum-1-ormanin-bekcileri/toprak_681494d114.mp3" }
      - { who: "mese", at: 340.27, do: "look_at", target: "camera", duration: 2.59 }
      - { who: "defne", at: 340.32, do: "look_at", target: "mese", duration: 5.52 }
      - { who: "toprak", at: 340.32, do: "look_at", target: "mese", duration: 3.49 }
      - { who: "mese", at: 340.47, do: "talk", duration: 2.19, text: "Yaklaşalım. Ama dikkatli olun.", audio: "audio/bolum-1-ormanin-bekcileri/mese_d5ec8e97d1.mp3" }
      - { who: "toprak", at: 342.66, do: "walk_to", to: [31.0, 36.6], speed: 1.1 }
      - { who: "mese", at: 342.78, do: "walk_to", to: [32.2, 39.4], speed: 1.1 }
      - { who: "defne", at: 342.9, do: "walk_to", to: [32.4, 42.6], speed: 1.1 }
      - { who: "mese", at: 343.31, do: "look_at", target: "defne", duration: 1.61 }
      - { who: "toprak", at: 343.31, do: "look_at", target: "defne", duration: 2.53 }
      - { who: "defne", at: 343.46, do: "talk", duration: 1.31, text: "Belki fırtına olmuştur?", audio: "audio/bolum-1-ormanin-bekcileri/defne_ca404b34a6.mp3" }
      - { who: "mese", at: 345.29, do: "look_at", target: "camera", duration: 3.06 }
      - { who: "defne", at: 345.34, do: "look_at", target: "mese", duration: 2.96 }
      - { who: "toprak", at: 345.34, do: "look_at", target: "mese", duration: 3.88 }
      - { who: "mese", at: 345.49, do: "talk", duration: 2.66, text: "Dün gece fırtına yoktu. Gökyüzü tertemizdi.", audio: "audio/bolum-1-ormanin-bekcileri/mese_efe93c5d80.mp3" }
      - { who: "mese", at: 348.72, do: "look_at", target: "defne", duration: 3.11 }
      - { who: "toprak", at: 348.72, do: "look_at", target: "defne", duration: 2.31 }
      - { who: "defne", at: 348.87, do: "talk", duration: 2.01, text: "Doğru. Rüzgâr olsaydı, ben bilirdim.", audio: "audio/bolum-1-ormanin-bekcileri/defne_3b74e1583f.mp3" }
      - { who: "defne", at: 350.88, do: "turn", to: "toprak", duration: 0.6 }
      - { who: "mese", at: 350.88, do: "turn", to: "toprak", duration: 0.6 }
      - { who: "toprak", at: 350.88, do: "turn", to: -119.1, duration: 0.6 }
      - { who: "toprak", at: 351.18, do: "clip", name: "point", duration: 9.0, loop: false, fade: 0.35 }
      - { who: "defne", at: 351.33, do: "look_at", target: "toprak", duration: 5.43 }
      - { who: "mese", at: 351.33, do: "look_at", target: "toprak", duration: 4.51 }
      - { who: "toprak", at: 351.48, do: "talk", duration: 4.21, text: "Bakın, kökleri sağlam. Toprağın altında hâlâ duruyorlar.", audio: "audio/bolum-1-ormanin-bekcileri/toprak_ad58670e2f.mp3" }
      - { who: "mese", at: 356.21, do: "look_at", target: "camera", duration: 2.7 }
      - { who: "defne", at: 356.26, do: "look_at", target: "mese", duration: 3.52 }
      - { who: "toprak", at: 356.26, do: "look_at", target: "mese", duration: 2.6 }
      - { who: "mese", at: 356.41, do: "talk", duration: 2.3, text: "Yani ağaç kökünden sökülmemiş.", audio: "audio/bolum-1-ormanin-bekcileri/mese_ce1db2508b.mp3" }
      - { who: "defne", at: 359.28, do: "look_at", target: "toprak", duration: 3.51 }
      - { who: "mese", at: 359.28, do: "look_at", target: "toprak", duration: 4.43 }
      - { who: "toprak", at: 359.43, do: "talk", duration: 3.21, text: "Hayır. Gövdesi... kesilmiş gibi.", audio: "audio/bolum-1-ormanin-bekcileri/toprak_cc9fcf932a.mp3" }
      - { who: "mese", at: 363.21, do: "look_at", target: "defne", duration: 3.52 }
      - { who: "toprak", at: 363.21, do: "look_at", target: "defne", duration: 2.6 }
      - { who: "defne", at: 363.36, do: "talk", duration: 2.3, text: "Kesilmiş mi? Kim keser ki koca bir çamı?", audio: "audio/bolum-1-ormanin-bekcileri/defne_d79dfb7457.mp3" }
      - { who: "defne", at: 363.36, do: "emote", expression: "surprised", duration: 2.9 }
      - { who: "defne", at: 366.23, do: "look_at", target: "toprak", duration: 4.05 }
      - { who: "mese", at: 366.23, do: "look_at", target: "toprak", duration: 3.25 }
      - { who: "toprak", at: 366.38, do: "talk", duration: 2.95, text: "Kesik çok düzgün. Bıçakla kesilmiş gibi pürüzsüz.", audio: "audio/bolum-1-ormanin-bekcileri/toprak_45791dfc21.mp3" }
      - { who: "mese", at: 369.73, do: "look_at", target: "camera", duration: 3.25 }
      - { who: "defne", at: 369.78, do: "look_at", target: "mese", duration: 3.15 }
      - { who: "toprak", at: 369.78, do: "look_at", target: "mese", duration: 4.07 }
      - { who: "mese", at: 369.93, do: "talk", duration: 2.85, text: "Kenarları da kararmış. Sanki... yanmış.", audio: "audio/bolum-1-ormanin-bekcileri/mese_12650bd3e7.mp3" }
      - { who: "mese", at: 373.35, do: "look_at", target: "defne", duration: 3.47 }
      - { who: "toprak", at: 373.35, do: "look_at", target: "defne", duration: 2.55 }
      - { who: "defne", at: 373.5, do: "talk", duration: 2.25, text: "Yanmış mı? Ama etrafta hiç yangın izi yok.", audio: "audio/bolum-1-ormanin-bekcileri/defne_60ed7c85b0.mp3" }
      - { who: "defne", at: 376.32, do: "look_at", target: "toprak", duration: 3.1 }
      - { who: "mese", at: 376.32, do: "look_at", target: "toprak", duration: 2.18 }
      - { who: "toprak", at: 376.47, do: "talk", duration: 1.88, text: "Bir koku var... Duman gibi.", audio: "audio/bolum-1-ormanin-bekcileri/toprak_47137412fe.mp3" }
      - { who: "mese", at: 378.87, do: "look_at", target: "camera", duration: 2.36 }
      - { who: "defne", at: 378.92, do: "look_at", target: "mese", duration: 5.36 }
      - { who: "toprak", at: 378.92, do: "look_at", target: "mese", duration: 3.18 }
      - { who: "mese", at: 379.07, do: "talk", duration: 1.96, text: "Evet, ben de alıyorum. Çok hafif.", audio: "audio/bolum-1-ormanin-bekcileri/mese_a46107633f.mp3" }
      - { who: "mese", at: 381.6, do: "look_at", target: "defne", duration: 1.76 }
      - { who: "toprak", at: 381.6, do: "look_at", target: "defne", duration: 2.68 }
      - { who: "defne", at: 381.75, do: "talk", duration: 1.46, text: "Yoksa bir yıldırım mı düştü?", audio: "audio/bolum-1-ormanin-bekcileri/defne_b62049daff.mp3" }
      - { who: "mese", at: 383.73, do: "look_at", target: "camera", duration: 4.0 }
      - { who: "defne", at: 383.78, do: "look_at", target: "mese", duration: 4.8 }
      - { who: "toprak", at: 383.78, do: "look_at", target: "mese", duration: 6.98 }
      - { who: "mese", at: 383.93, do: "talk", duration: 3.6, text: "Yıldırım ağacı yarar, parçalar. Böyle düzgün kesmez.", audio: "audio/bolum-1-ormanin-bekcileri/mese_4921c28ef4.mp3" }
      - { who: "defne", at: 388.08, do: "look_at", target: "toprak", duration: 1.76 }
      - { who: "mese", at: 388.08, do: "look_at", target: "toprak", duration: 2.68 }
      - { who: "toprak", at: 388.23, do: "talk", duration: 1.46, text: "O zaman bunu biri yaptı.", audio: "audio/bolum-1-ormanin-bekcileri/toprak_673a844389.mp3" }
      - { who: "mese", at: 390.26, do: "look_at", target: "defne", duration: 4.12 }
      - { who: "toprak", at: 390.26, do: "look_at", target: "defne", duration: 4.12 }
      - { who: "defne", at: 390.41, do: "talk", duration: 1.1, text: "Ama kim? Neden?", audio: "audio/bolum-1-ormanin-bekcileri/defne_c37f3e392e.mp3" }
      - { who: "mese", at: 393.88, do: "look_at", target: "defne", duration: 4.35 }
      - { who: "toprak", at: 393.88, do: "look_at", target: "defne", duration: 2.23 }

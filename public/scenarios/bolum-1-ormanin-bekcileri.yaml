      - { who: "toprak", at: 457.94, do: "talk", duration: 1.36, text: "Yani kurtarabilir miyiz?", audio: "audio/bolum-1-ormanin-bekcileri/toprak_ec889cb6e2.mp3" }
      - { who: "toprak", at: 457.94, do: "emote", expression: "happy", duration: 1.96 }

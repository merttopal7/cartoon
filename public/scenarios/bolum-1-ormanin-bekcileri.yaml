      - { who: "mese", at: 109.17, do: "talk", duration: 4.23, text: "Peki. Ağzı var, dili yok. Durmadan akar, hiç yorulmaz. Nedir?", audio: "audio/bolum-1-ormanin-bekcileri/mese_1d9ffc1a40.mp3" }

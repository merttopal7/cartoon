      - { who: "defne", at: 509.05, do: "talk", duration: 1.93, text: "Bak, şimdiden daha mutlu görünüyor!", audio: "audio/bolum-1-ormanin-bekcileri/defne_37065b075d.mp3" }
      - { who: "defne", at: 511.55, do: "look_at", target: "toprak", duration: 2.87 }

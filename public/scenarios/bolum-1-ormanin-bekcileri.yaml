      - { who: "toprak", at: 538.01, do: "look_at", target: "defne", duration: 3.36 }
      - { who: "defne", at: 538.16, do: "talk", duration: 2.14, text: "Demek onlar da ağaç için endişelenmiş.", audio: "audio/bolum-1-ormanin-bekcileri/defne_5664d850f1.mp3" }
      - { who: "mese", at: 540.82, do: "look_at", target: "camera", duration: 4.21 }

      - { who: "mese", at: 404.9, do: "talk", duration: 2.8, text: "Korkmak ayıp değil. Ama aklımızı kullanalım.", audio: "audio/bolum-1-ormanin-bekcileri/mese_9b15084306.mp3" }
      - { who: "defne", at: 408.35, do: "look_at", target: "toprak", duration: 2.6 }
      - { who: "mese", at: 408.35, do: "look_at", target: "toprak", duration: 3.52 }
      - { who: "toprak", at: 408.5, do: "talk", duration: 2.3, text: "Durun... Burada başka izler de var.", audio: "audio/bolum-1-ormanin-bekcileri/toprak_3e32a95a20.mp3" }
      - { who: "toprak", at: 408.5, do: "emote", expression: "surprised", duration: 2.9 }

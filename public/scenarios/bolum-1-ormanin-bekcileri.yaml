      - { who: "toprak", at: 103.47, do: "talk", duration: 1.72, text: "Sıkıcı değil, dikkatli!", audio: "audio/bolum-1-ormanin-bekcileri/toprak_d0781fd59c.mp3" }
      - { who: "mese", at: 106.24, do: "look_at", target: "defne", duration: 2.36 }
      - { who: "toprak", at: 106.24, do: "look_at", target: "defne", duration: 3.28 }
      - { who: "defne", at: 106.39, do: "talk", duration: 2.06, text: "Sıkıldım ama. Hadi bilmece oynayalım!", audio: "audio/bolum-1-ormanin-bekcileri/defne_af3f35a44e.mp3" }

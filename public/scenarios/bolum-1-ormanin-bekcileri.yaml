      - { who: "toprak", at: 548.37, do: "look_at", target: "mese", duration: 5.11 }
      - { who: "mese", at: 548.52, do: "talk", duration: 2.01, text: "Gelirler. Korkuları geçince.", audio: "audio/bolum-1-ormanin-bekcileri/mese_a4f431a6d2.mp3" }

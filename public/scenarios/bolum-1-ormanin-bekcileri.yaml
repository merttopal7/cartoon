      - { who: "toprak", at: 513.92, do: "look_at", target: "mese", duration: 3.85 }
      - { who: "mese", at: 514.07, do: "talk", duration: 3.55, text: "Elbette. Dinlersen, teşekkür ettiğini duyarsın.", audio: "audio/bolum-1-ormanin-bekcileri/mese_68618da79d.mp3" }
      - { who: "mese", at: 520.99, do: "look_at", target: "defne", duration: 2.58 }
      - { who: "toprak", at: 520.99, do: "look_at", target: "defne", duration: 4.76 }
      - { who: "defne", at: 521.14, do: "talk", duration: 1.36, text: "Duydum! Hışırdadı!", audio: "audio/bolum-1-ormanin-bekcileri/defne_98061976a3.mp3" }
      - { who: "defne", at: 521.14, do: "emote", expression: "happy", duration: 1.96 }
      - { who: "defne", at: 523.07, do: "look_at", target: "toprak", duration: 1.76 }
      - { who: "mese", at: 523.07, do: "look_at", target: "toprak", duration: 2.68 }
      - { who: "toprak", at: 523.22, do: "talk", duration: 1.46, text: "Bence o sadece rüzgârdı.", audio: "audio/bolum-1-ormanin-bekcileri/toprak_6a3f65e06b.mp3" }
      - { who: "mese", at: 525.25, do: "look_at", target: "defne", duration: 2.08 }
      - { who: "toprak", at: 525.25, do: "look_at", target: "defne", duration: 5.38 }
      - { who: "defne", at: 525.4, do: "talk", duration: 1.78, text: "Rüzgâr da benim, teşekkür de!", audio: "audio/bolum-1-ormanin-bekcileri/defne_cb343e5916.mp3" }
      - { who: "mese", at: 530.08, do: "look_at", target: "camera", duration: 1.94 }

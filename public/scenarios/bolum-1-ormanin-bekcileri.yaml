      - { who: "defne", at: 86.26, do: "talk", duration: 2.06, text: "Sıkıldım ama. Hadi bilmece oynayalım!", audio: "audio/bolum-1-ormanin-bekcileri/defne_af3f35a44e.mp3" }
      - { who: "mese", at: 88.36, do: "look_at", target: "camera", duration: 4.63 }

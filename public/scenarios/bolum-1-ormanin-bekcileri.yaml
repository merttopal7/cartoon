      - { who: "defne", at: 126.39, do: "talk", duration: 2.56, text: "Geyikler sabah yürüyüşüne çıkmış, ne var bunda?", audio: "audio/bolum-1-ormanin-bekcileri/defne_a663031acb.mp3" }
      - { who: "defne", at: 129.04, do: "look_at", target: "toprak", duration: 4.69 }
      - { who: "toprak", at: 129.19, do: "talk", duration: 4.39, text: "Ama izler derin. Koşarak geçmişler. Hem de güneye doğru.", audio: "audio/bolum-1-ormanin-bekcileri/toprak_831acf3787.mp3" }

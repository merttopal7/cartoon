      - { who: "toprak", at: 530.13, do: "look_at", target: "mese", duration: 1.84 }
      - { who: "mese", at: 530.28, do: "talk", duration: 1.54, text: "Şşş! Dinleyin...", audio: "audio/bolum-1-ormanin-bekcileri/mese_08d069850b.mp3" }
      - { who: "mese", at: 530.28, do: "emote", expression: "surprised", duration: 2.14 }
      - { who: "defne", at: 534.99, do: "look_at", target: "toprak", duration: 2.6 }

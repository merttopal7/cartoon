      - { who: "mese", at: 136.78, do: "talk", duration: 3.81, text: "Geyikler sabahları sakin sakin otlar. Neden koşsunlar ki?", audio: "audio/bolum-1-ormanin-bekcileri/mese_f3bd0f403a.mp3" }
      - { who: "toprak", at: 140.68, do: "look_at", target: "defne", duration: 4.94 }
      - { who: "defne", at: 140.83, do: "talk", duration: 1.52, text: "Belki onlar da yarışıyordur!", audio: "audio/bolum-1-ormanin-bekcileri/defne_b7b5b76b3e.mp3" }

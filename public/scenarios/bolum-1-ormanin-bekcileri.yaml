      - { who: "mese", at: 492.19, do: "talk", duration: 2.3, text: "Tam yerine oturdu. Aferin Defne.", audio: "audio/bolum-1-ormanin-bekcileri/mese_440cbf44d8.mp3" }
      - { who: "mese", at: 492.19, do: "emote", expression: "happy", duration: 2.9 }

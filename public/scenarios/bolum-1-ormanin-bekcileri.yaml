      - { who: "mese", at: 88.56, do: "talk", duration: 4.23, text: "Peki. Ağzı var, dili yok. Durmadan akar, hiç yorulmaz. Nedir?", audio: "audio/bolum-1-ormanin-bekcileri/mese_1d9ffc1a40.mp3" }
      - { who: "defne", at: 92.88, do: "look_at", target: "toprak", duration: 1.82 }
      - { who: "toprak", at: 93.03, do: "talk", duration: 1.52, text: "Kolay! Dere!", audio: "audio/bolum-1-ormanin-bekcileri/toprak_f135d3af2a.mp3" }

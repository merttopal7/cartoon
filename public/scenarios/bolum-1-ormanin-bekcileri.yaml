      - { who: "toprak", at: 535.14, do: "talk", duration: 2.3, text: "Kuşlar! Kuşlar geri döndü!", audio: "audio/bolum-1-ormanin-bekcileri/toprak_ac2cea4cda.mp3" }
      - { who: "toprak", at: 535.14, do: "emote", expression: "happy", duration: 2.9 }

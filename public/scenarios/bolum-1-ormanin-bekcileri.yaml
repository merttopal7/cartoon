      - { who: "mese", at: 133.82, do: "talk", duration: 2.72, text: "Çamur hâlâ ıslak. Bu izler bu sabah olmuş.", audio: "audio/bolum-1-ormanin-bekcileri/mese_246d69b5f8.mp3" }
      - { who: "mese", at: 136.58, do: "look_at", target: "camera", duration: 4.21 }

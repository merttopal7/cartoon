      - { who: "mese", at: 71.71, do: "talk", duration: 3.19, text: "Her şey zamanında büyür. Orman acele etmez.", audio: "audio/bolum-1-ormanin-bekcileri/mese_5fdd5980fc.mp3" }
      - { who: "mese", at: 75.59, do: "look_at", target: "defne", duration: 2.65 }

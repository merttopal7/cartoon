      - { who: "toprak", at: 397.88, do: "talk", duration: 3.27, text: "Bir yaprak, Defne. Sadece bir yaprak.", audio: "audio/bolum-1-ormanin-bekcileri/toprak_43246d60af.mp3" }
      - { who: "mese", at: 401.15, do: "clip", name: "disarm_bow", duration: 1.08, loop: false, fade: 0.2 }

      - { who: "mese", at: 46.36, do: "talk", duration: 4.15, text: "Ağaçlar suyunu içmiş. Yapraklarına bak, nasıl parlıyorlar.", audio: "audio/bolum-1-ormanin-bekcileri/mese_1451ee2ee4.mp3" }
      - { who: "toprak", at: 50.6, do: "look_at", target: "defne", duration: 3.25 }
      - { who: "defne", at: 50.75, do: "talk", duration: 2.95, text: "Bence en güzeli rüzgâr. Bugün tam uçurtma havası!", audio: "audio/bolum-1-ormanin-bekcileri/defne_11d00bfe9d.mp3" }
      - { who: "defne", at: 53.79, do: "look_at", target: "toprak", duration: 2.83 }
      - { who: "mese", at: 53.79, do: "look_at", target: "toprak", duration: 4.38 }
      - { who: "toprak", at: 53.94, do: "talk", duration: 2.53, text: "Senin için her gün uçurtma havası.", audio: "audio/bolum-1-ormanin-bekcileri/toprak_62794395d4.mp3" }
      - { who: "defne", at: 56.47, do: "ability", name: "hortum_gosterisi" }

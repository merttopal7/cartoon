# =============================================================================
# YETENEK TANIMLARI — her yetenek yalnızca burada tanımlanır.
# -----------------------------------------------------------------------------
# Motor bu dosyadan şunları türetir: senaryoda geçerli yetenek adları (takma adlar dahil),
# karakterlere yüklenecek klipler, zaman çizelgesi (fırlatma, isabet, sönme), savrulma ve HUD ikonu.
#
# Alanlar:
#   title         Ekranda görünen ad
#   aliases       Senaryoda aynı yeteneği çağıran diğer adlar
#   effect        Görsel efekt: fire | tornado | rain | shadow | tree_fall | tree_lift | earth, element gösterileri
#                 whirl | rock_rise | wave (kodu src/engine/ability-fx/)
#   element       ates | su | toprak | hava (golge: elementsiz eski yetenekler). Karakter varlığında `element`
#                 tanımlıysa ve yeteneğinkiyle uyuşmuyorsa yüklemede uyarı verilir.
#                 Ormanın Bekçileri: Karabey ateş, Meşe su, Toprak toprak, Defne hava.
#   target        character (varsayılan) | map_tree (haritadaki Realistic_Pine_* ağacı; hedef karakter gerekmez) |
#                 self (hedefsiz element gösterisi: efekt kullananın çevresinde; savrulma, vuruş hissi, savaş müziği yok)
#   icon          HUD ikonu (src/ui/ability-icons.ts içindeki anahtar); verilmezse yeteneğin kendi adı
#   clips         Kullananın sırayla oynattığı klipler:
#                   name      klip adı
#                   duration  oynatma süresi (sn). Verilmezse klibin gerçek süresi. Uzun bir klibin yalnızca
#                             başını oynatmak için kısaltın; döngülü (loop) kliplerde istenen toplam süre.
#                   loop      süre boyunca döngüyle oynasın
#                   fade      bu klibe geçiş süresi (sn); varsayılan 0.3
#   release       Efektin hedefe fırladığı an: { clip: <klip adı>, at: <o klibin başından saniye> }
#   flight        Fırlatmadan isabete uçuş süresi (sn)
#   linger        İsabetten sonra efektin sönmesi (sn)
#   knockback     (self'te gerekmez) Hedefin savrulması: arc = en çok yay yüksekliği (m; asıl yükseklik mesafeyle ölçeklenir),
#                 duration = savrulma süresi (sn). Mesafeyi senaryo verir (knockback: 0.4).
#   impact_clip   Hedefin varsayılan tepki klibi (senaryoda impact_clip ile ezilir)
#   target_clips  Hedefe ayrıca yüklenecek tepki klipleri
#
# Senaryoda `clips: [a, b]` verilirse yetenek bu kliplerle oynar: süreler kliplerin gerçek süresidir ve
# fırlatma anı, aynı sıradaki klipte aynı orana (ör. klibin %42'si) kaydırılır.
# =============================================================================

# --- ATEŞ ---------------------------------------------------------------------

# Karabey: büyü toplar (casting; alev havaya kaldırdığı sağ elinde büyür), kılıcıyla saldırırken sağ eli en öne
# uzandığı an (attack_2'nin 0.55. sn'si, el ~8 m/sn) ateş topunu elinden fırlatır. Çoklu hedefte tek top toplanır,
# fırlatmada her hedefe bir alev dağılır.
alev_buyusu:
  title: Alev Büyüsü
  aliases: [ates_buyusu, ates_firtinasi, fire_spell]
  effect: fire
  element: ates
  icon: ates_topu
  clips:
    - { name: casting, duration: 1.30 }
    - { name: attack_2 }
  release: { clip: attack_2, at: 0.55 }
  flight: 0.62
  linger: 1.30
  knockback: { arc: 1.0, duration: 0.85 }
  impact_clip: impact_3
  target_clips: [impact_3, dodge_back, fall_flat]

ates_topu:
  title: Ateş Topu
  aliases: [fireball]
  effect: fire
  element: ates
  clips:
    - { name: hook_punch }
  release: { clip: hook_punch, at: 0.92 }
  flight: 0.58
  linger: 1.45
  knockback: { arc: 1.15, duration: 0.9 }
  impact_clip: death
  target_clips: [death, fall_flat]

alev_tekmesi:
  title: Alev Tekmesi
  aliases: [flame_kick]
  effect: fire
  element: ates
  icon: ates_topu
  clips:
    - { name: macaco_side, duration: 1.35 }
    - { name: flying_kick }
  release: { clip: flying_kick, at: 0.10 }
  flight: 0.60
  linger: 1.30
  knockback: { arc: 1.20, duration: 0.9 }
  impact_clip: impact_3
  target_clips: [impact_3, fall_flat]

# --- HAVA ----------------------------------------------------------------------

# Defne: hortum, kullananın içinde Hurricane Kick dönerken oluşur; uçan tekmeyle hedefe gönderilir.
ruzgar_hortumu:
  title: Rüzgar Hortumu
  aliases: [hortum, wind_tornado, kasirga_tufani, whirlwind_kick]
  effect: tornado
  element: hava
  clips:
    - { name: hurricane_kick, duration: 2.25, loop: true }
    - { name: flying_kick, duration: 1.65 }
  release: { clip: hurricane_kick, at: 2.25 }
  flight: 0.80
  linger: 1.30
  knockback: { arc: 1.55, duration: 1.05 }
  impact_clip: impact_2
  target_clips: [impact_2, fall_flat]

# --- SU ------------------------------------------------------------------------

# Meşe: yayı çeker, sol eldeki yayda güç toplar, kiriş bırakıldığı anda (aim_recoil 0.15 sn) su oku çıkar;
# hedefte sağanak yağmur bulutu oluşur. Kiriş kemiği de bu kliplerin zamanına göre çekilip bırakılır.
firtina_oku:
  title: Sağanak Oku
  aliases: [yagmur_oku, rain_arrow, storm_arrow, yagmur, yagmur_bulutu, orman_yagmuru, rain, su_oku, water_arrow]
  effect: rain
  element: su
  clips:
    - { name: draw_arrow, fade: 0.2 }
    - { name: aim_overdraw, duration: 1.0, fade: 0.15 }
    - { name: aim_recoil, fade: 0.15 }
  release: { clip: aim_recoil, at: 0.15 }
  flight: 0.63
  linger: 1.90
  knockback: { arc: 0.65, duration: 0.85 }
  impact_clip: impact_3
  target_clips: [impact_3, death, fall_flat]

# --- TOPRAK --------------------------------------------------------------------

# Toprak: kollarını gererek güç toplar, diz çöküp yere dokunur (release); ondan hedefe doğru sırayla yerden
# kaya dikenler fışkırır, hedefin altında üç büyük diken ve toz bulutu.
yer_dikeni:
  title: Yer Dikenleri
  aliases: [toprak_dikeni, kaya_dikeni, earth_spikes]
  effect: earth
  element: toprak
  clips:
    - { name: stretch, duration: 1.0 }
    - { name: point, duration: 1.85, fade: 0.25 }
  release: { clip: point, at: 0.35 }
  flight: 0.75
  linger: 1.15
  knockback: { arc: 1.1, duration: 0.9 }
  impact_clip: impact_3
  target_clips: [impact_3, fall_flat, death]

# --- GÖLGE (elementsiz eski yetenekler; Ormanın Bekçileri'nde artık kullanılmıyor) -----------------

golge_kilic:
  title: Gölge Kılıç
  aliases: [golge_dalgasi, shadow_slash]
  effect: shadow
  element: golge
  icon: karanlik_buyu
  clips:
    - { name: power_up, duration: 1.35 }
    - { name: slash_2, duration: 1.60 }
  release: { clip: slash_2, at: 0.85 }
  flight: 0.62
  linger: 0.88
  knockback: { arc: 0.32, duration: 0.8 }
  impact_clip: dodge_back
  target_clips: [dodge_back, fall_flat]

# Duman kullananın başının üstünde toplanır, çoklu hedefte kollara ayrılıp hepsine aynı anda girer.
karanlik_buyu:
  title: Karanlık Büyü
  aliases: [shadow_storm]
  effect: shadow
  element: golge
  clips:
    - { name: casting, duration: 1.30 }
    - { name: attack_2, duration: 1.55 }
  release: { clip: attack_2, at: 0.82 }
  flight: 0.62
  linger: 0.86
  knockback: { arc: 0.32, duration: 0.8 }
  impact_clip: dodge_back
  target_clips: [dodge_back, fall_flat]

# Karabey: güç toplar, kızgın yatay kılıç darbesiyle haritadaki çamı keser (release = kesik); ağaç devrilip
# yere çarpar (isabet). Kesik, devrilme ve sürüklenme efekti kesik anına göre zamanlanır.
# Defne: Karabey'in devirdiği ağacı rüzgârla kaldırıp kütüğüne geri diker (hasar vermez). Superhuman Choke Lift:
# kolunu ağaca uzatırken rüzgâr toplanır, "yakaladığı" an (1.3 sn) ağaç havalanır, kol kalkarken havada dikilir,
# kol indiğinde (≈3.85 sn) kütüğüne oturur ve kesik kaynaşır.
# Hedef verilmezse kullanana en yakın devrik ağaç dikilir.
agac_dikme:
  title: Ağaç Dikme
  aliases: [agac_kaldirma, agac_duzeltme, tree_lift, tree_raise]
  effect: tree_lift
  element: hava
  target: map_tree
  clips:
    - { name: choke_lift, duration: 4.30 }
  release: { clip: choke_lift, at: 1.30 }
  flight: 2.55
  linger: 1.40
  knockback: { arc: 0.0, duration: 0.5 }
  impact_clip: fall_flat

agac_devirme:
  title: Ağaç Devirme
  aliases: [tree_fall]
  effect: tree_fall
  element: ates
  target: map_tree
  clips:
    - { name: power_up, duration: 1.15 }
    - { name: slash_2, duration: 1.65 }
  release: { clip: slash_2, at: 0.50 }
  flight: 0.73
  linger: 1.32
  knockback: { arc: 0.95, duration: 0.85 }
  impact_clip: fall_flat
  target_clips: [fall_flat, dodge_back]

# --- ELEMENT GÖSTERİLERİ (açılış klibi; hedefsiz) ----------------------------------------------------------
# Bekçiler kendini tanıtırken elementini gösterir. Gösteri chargeEnd'de (release) doğar, impactOffset'te tam boyuna
# ulaşır, linger boyunca (replik süresince) durur ve son saniyelerde söner.

# Defne: Northern Soul Spin dönerken (dönüşün ilk 2.6 sn'si) ayağının dibinde rüzgâr toplanır; 1.4. sn'de (release)
# altında kısa bir hortum (saldırı hortumunun ~%25'i, 0.85 m) yükselip onu dönerken kaldırır; tepesinde konuşur, sonda
# iner ve hortum dağılır. Hazırlık kısa: açılışta replik yükseliş biter bitmez başlar.
hortum_gosterisi:
  title: Rüzgâr Hortumu
  aliases: [whirl_show]
  effect: whirl
  element: hava
  target: self
  icon: ruzgar_hortumu
  clips:
    - { name: northern_soul_spin, duration: 2.60 }
  release: { clip: northern_soul_spin, at: 1.40 }
  flight: 0.80
  linger: 3.75

# Toprak: kısaca kollarını gerer, diz çöküp yere dokunur (release); altından düz tepeli kaya sütunu yükselip onu
# ~0.9 m kaldırır, çevresinde kaya dikenler fışkırır. Kaya yükselirken konuşmaya başlar; son 1.1 sn'de kaya batar.
kaya_yukselisi:
  title: Kaya Kulesi
  aliases: [rock_rise_show]
  effect: rock_rise
  element: toprak
  target: self
  icon: yer_dikeni
  clips:
    - { name: stretch, duration: 0.6 }
    - { name: point, duration: 1.5, fade: 0.2 }
  release: { clip: point, at: 0.30 }
  flight: 0.80
  linger: 4.85

# Meşe: elini kaldırıp su toplar (ayağının çevresinde su halkası, yükselen damlalar); altından dalga kabarıp onu
# tepesinde 1.25 m kaldırır, köpüklü dudağı önünde kıvrılır; o konuşurken akar, son 1.4 sn'de çöker ve Meşe iner.
dalga_gosterisi:
  title: Su Dalgası
  aliases: [wave_show]
  effect: wave
  element: su
  target: self
  icon: firtina_oku
  clips:
    - { name: casting, duration: 1.40 }
  release: { clip: casting, at: 0.80 }
  flight: 0.80
  linger: 3.90
